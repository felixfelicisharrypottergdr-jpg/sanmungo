<div id="creazione-pozione" class="foglio"> 
<style>
@import url('https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css');

  font-family:'magic';

  font-weight:normal;

}
/* ==========================================================
   CREAZIONE DI UNA POZIONE — Extra+ integrate
   Peltro + verde acido + viola scuro
   Stile più ricco e leggibile, ispirato alla Ricerca Pazienti.
   Tutto circoscritto a #creazione-pozione per non toccare il resto del forum.
   ========================================================== */

#creazione-pozione{
  --bg:#171a1b;
  --bg2:#101213;
  --panel:#252a2b;
  --panel-hi:#2d3334;
  --panel2:#1e2223;
  --line:#505957;

  --acid:#9fbe28;
  --acid-soft:#d4e77d;
  --acid-dim:#7f9920;

  --purple:#35163f;
  --purple2:#482252;
  --purple-soft:#b89cc1;

  --text:#eeeae2;
  --text-dim:#bdbbb2;
  --text-soft:#d7d3c9;

  --danger:#c9687c;
  --danger-bg:#3a2027;

  --serif:'Iowan Old Style','Palatino Linotype',Georgia,'Times New Roman',serif;
  --mono:'Consolas','Courier New',monospace;

  /* alias usati dal JS/CSS preesistente */
  --parch:var(--text);
  --parch-dark:var(--text-dim);
  --ink:var(--text);
  --green:var(--purple);
  --green-dark:var(--acid);
  --gold:var(--acid);

  width:100% !important;
  max-width:none !important;
  min-height:0 !important;
  margin:0 !important;
  padding:0 0 72px 0 !important;
  box-sizing:border-box !important;

  background:
    radial-gradient(circle at 12% 0%, rgba(159,190,40,.09), transparent 30%),
    radial-gradient(circle at 88% 8%, rgba(72,34,82,.32), transparent 36%),
    linear-gradient(180deg,#202425 0%,#171a1b 68%,#121415 100%) !important;

  color:var(--text) !important;
  font-family:var(--serif) !important;
  font-size:15px !important;
  line-height:1.55 !important;
}

#creazione-pozione,
#creazione-pozione *{
  box-sizing:border-box !important;
}

/* ---------- contenitore ---------- */

#creazione-pozione .wrap{
  width:96% !important;
  max-width:1180px !important;
  margin:0 auto !important;
  padding:42px 26px 72px !important;
}

/* ---------- sigillo ---------- */

#creazione-pozione .seal{
  width:64px !important;
  height:64px !important;
  margin:0 auto 15px !important;
  display:flex !important;
  align-items:center !important;
  justify-content:center !important;
  border:1px solid var(--acid) !important;
  border-radius:50% !important;
  background:radial-gradient(circle,rgba(159,190,40,.13),rgba(53,22,63,.20) 68%,rgba(16,18,19,.78)) !important;
  color:var(--acid) !important;
  font-size:30px !important;
  line-height:1 !important;
  box-shadow:0 0 0 4px rgba(159,190,40,.035),0 8px 24px rgba(0,0,0,.26),inset 0 0 18px rgba(159,190,40,.08) !important;
}
#creazione-pozione .seal i{color:var(--acid) !important;}

/* ---------- testata ---------- */

#creazione-pozione .main-title{
  position:relative !important;
  margin:0 auto 8px !important;
  padding:0 20px !important;
  text-align:center !important;
  color:var(--text) !important;
  font-family:'magic',var(--serif) !important;
  font-size:42px !important;
  line-height:1.15 !important;
  font-weight:400 !important;
  letter-spacing:.015em !important;
  text-shadow:0 2px 8px rgba(0,0,0,.45) !important;
}

#creazione-pozione .main-title:after{
  content:"" !important;
  display:block !important;
  width:110px !important;
  height:1px !important;
  margin:16px auto 0 !important;
  background:linear-gradient(90deg,transparent,var(--acid),transparent) !important;
}

#creazione-pozione .title-flask{
  display:inline-block !important;
  margin:0 10px !important;
  color:var(--acid-soft) !important;
  font-size:.62em !important;
  vertical-align:3px !important;
  text-shadow:0 0 10px rgba(159,190,40,.22) !important;
}

/* NON ridefiniamo :before di Font Awesome:
   il forum può già caricare correttamente l'icona fa-flask. */

#creazione-pozione .subtitle{
  max-width:720px !important;
  margin:0 auto 34px !important;
  text-align:center !important;
  color:var(--text-dim) !important;
  font-family:var(--serif) !important;
  font-size:16px !important;
  line-height:1.55 !important;
  font-weight:400 !important;
  font-style:italic !important;
}

/* ---------- navigazione ---------- */

#creazione-pozione .steps-nav{
  display:flex !important;
  flex-wrap:wrap !important;
  justify-content:center !important;
  gap:0 !important;
  width:100% !important;
  margin:0 0 32px !important;
  padding:0 10px !important;
  overflow:hidden !important;

  background:
    linear-gradient(180deg,rgba(72,34,82,.22),rgba(16,18,19,.96)) !important;
  border:1px solid var(--line) !important;
  border-radius:10px !important;
  box-shadow:0 8px 22px rgba(0,0,0,.22) !important;
}

#creazione-pozione button.step-btn{
  flex:1 1 135px !important;
  min-width:120px !important;
  min-height:51px !important;
  margin:0 !important;
  padding:15px 10px 13px !important;

  appearance:none !important;
  background:transparent !important;
  border:0 !important;
  border-bottom:3px solid transparent !important;
  border-radius:0 !important;
  box-shadow:none !important;

  color:var(--text-dim) !important;
  font-family:var(--mono) !important;
  font-size:11px !important;
  font-weight:400 !important;
  line-height:1.35 !important;
  letter-spacing:.035em !important;
  text-transform:uppercase !important;
  text-shadow:none !important;
  cursor:pointer !important;
}

#creazione-pozione button.step-btn:hover{
  background:rgba(255,255,255,.035) !important;
  color:var(--text) !important;
}

#creazione-pozione button.step-btn.active{
  background:linear-gradient(180deg,rgba(159,190,40,.16),rgba(159,190,40,.05)) !important;
  border-bottom-color:var(--acid) !important;
  color:var(--acid-soft) !important;
}

/* ---------- pannello di ogni fase ---------- */

#creazione-pozione .panel{
  position:relative !important;
  width:100% !important;
  margin:0 0 24px !important;
  padding:30px 32px 32px !important;

  background:
    linear-gradient(180deg,var(--panel-hi) 0%,var(--panel) 100%) !important;
  border:1px solid var(--line) !important;
  border-radius:12px !important;
  box-shadow:
    0 14px 34px rgba(0,0,0,.25),
    inset 0 1px 0 rgba(255,255,255,.025) !important;

  color:var(--text) !important;
}

#creazione-pozione .panel:before{
  content:"" !important;
  position:absolute !important;
  top:-1px !important;
  left:28px !important;
  right:28px !important;
  height:2px !important;
  background:linear-gradient(90deg,transparent,var(--acid-dim),transparent) !important;
  opacity:.75 !important;
}

#creazione-pozione .panel h2{
  margin:0 0 9px !important;
  padding:0 0 0 15px !important;
  border:0 !important;
  border-left:3px solid var(--acid) !important;

  color:var(--text) !important;
  font-family:'magic',var(--serif) !important;
  font-size:26px !important;
  line-height:1.25 !important;
  font-weight:400 !important;
  letter-spacing:.01em !important;
  text-shadow:none !important;
}

#creazione-pozione .panel h3{
  color:var(--text) !important;
  font-family:'magic',var(--serif) !important;
  font-size:19px !important;
  font-weight:400 !important;
}

#creazione-pozione .panel p{
  color:var(--text-soft) !important;
  font-family:var(--serif) !important;
  font-size:15px !important;
  line-height:1.6 !important;
}

#creazione-pozione .panel b,
#creazione-pozione .panel strong{
  color:var(--acid-soft) !important;
  font-weight:600 !important;
}

/* ---------- testo introduttivo / note ---------- */

#creazione-pozione .guide-text{
  margin:16px 0 28px !important;
  padding:15px 18px !important;

  background:
    linear-gradient(90deg,rgba(53,22,63,.62),rgba(53,22,63,.25)) !important;
  border:0 !important;
  border-left:3px solid var(--acid) !important;
  border-radius:0 8px 8px 0 !important;

  color:var(--text-soft) !important;
  font-family:var(--serif) !important;
  font-size:14.5px !important;
  line-height:1.6 !important;
}

/* ---------- righe / campi ---------- */

#creazione-pozione .row{
  display:flex !important;
  flex-wrap:wrap !important;
  align-items:flex-start !important;
  width:100% !important;
  column-gap:22px !important;
  row-gap:18px !important;
  margin:0 0 20px !important;
}

#creazione-pozione .row > div{
  flex:1 1 220px !important;
  min-width:190px !important;
}

#creazione-pozione label{
  display:block !important;
  margin:0 0 6px !important;

  color:var(--acid-soft) !important;
  font-family:var(--mono) !important;
  font-size:11px !important;
  line-height:1.35 !important;
  font-weight:400 !important;
  letter-spacing:.055em !important;
  text-transform:uppercase !important;
}

#creazione-pozione input[type="text"],
#creazione-pozione input[type="number"],
#creazione-pozione select,
#creazione-pozione textarea{
  width:100% !important;
  max-width:none !important;
  min-height:39px !important;
  margin:0 !important;
  padding:9px 11px !important;

  appearance:auto !important;
  background:var(--bg2) !important;
  border:1px solid var(--line) !important;
  border-radius:6px !important;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.35) !important;

  color:var(--text) !important;
  font-family:var(--mono) !important;
  font-size:13.5px !important;
  line-height:1.35 !important;
  font-weight:400 !important;
}

#creazione-pozione input[type="text"]:focus,
#creazione-pozione input[type="number"]:focus,
#creazione-pozione select:focus,
#creazione-pozione textarea:focus{
  outline:none !important;
  border-color:var(--acid) !important;
  box-shadow:
    0 0 0 2px rgba(159,190,40,.10),
    inset 0 1px 2px rgba(0,0,0,.35) !important;
}

#creazione-pozione select option{
  background:var(--bg2) !important;
  color:var(--text) !important;
}

#creazione-pozione input[type="checkbox"]{
  width:16px !important;
  height:16px !important;
  min-height:0 !important;
  margin:0 !important;
  padding:0 !important;
  accent-color:var(--acid) !important;
}

#creazione-pozione .chk-line{
  display:flex !important;
  align-items:center !important;
  gap:9px !important;
  margin:9px 0 !important;
  padding:4px 0 !important;

  color:var(--text) !important;
  font-family:var(--serif) !important;
  font-size:14.5px !important;
  line-height:1.45 !important;
}

#creazione-pozione .chk-line span{
  color:var(--text) !important;
}

/* ---------- divisori ---------- */

#creazione-pozione .divider{
  height:1px !important;
  margin:26px 0 22px !important;
  padding:0 !important;
  border:0 !important;
  background:linear-gradient(90deg,var(--line),rgba(80,89,87,.28),transparent) !important;
}

/* ---------- schede personaggio ---------- */

#creazione-pozione .pg-card{
  position:relative !important;
  margin:0 0 20px !important;
  padding:22px 24px !important;

  background:
    linear-gradient(180deg,rgba(53,22,63,.20),rgba(30,34,35,.96) 30%) !important;
  border:1px solid var(--line) !important;
  border-radius:9px !important;
  box-shadow:0 7px 20px rgba(0,0,0,.18) !important;

  color:var(--text) !important;
}

#creazione-pozione .pg-card:before{
  content:"" !important;
  position:absolute !important;
  left:-1px !important;
  top:18px !important;
  bottom:18px !important;
  width:3px !important;
  border-radius:3px !important;
  background:var(--acid) !important;
  opacity:.65 !important;
}

#creazione-pozione .pg-card h3{
  display:flex !important;
  align-items:center !important;
  justify-content:space-between !important;
  gap:14px !important;

  margin:0 0 20px !important;
  padding:0 0 10px !important;
  border-bottom:1px solid rgba(80,89,87,.78) !important;

  color:var(--text) !important;
  font-family:var(--serif) !important;
  font-size:20px !important;
  font-weight:400 !important;
}

#creazione-pozione .pg-card > p{
  margin:18px 0 16px !important;
  color:var(--text-soft) !important;
  font-size:14.5px !important;
}

#creazione-pozione .pg-card > p b{
  color:var(--acid-soft) !important;
  font-size:16px !important;
  font-weight:400 !important;
}

/* ---------- pulsanti ---------- */

#creazione-pozione button.action{
  display:inline-flex !important;
  align-items:center !important;
  justify-content:center !important;
  gap:8px !important;

  min-height:40px !important;
  margin:10px 8px 0 0 !important;
  padding:10px 18px !important;

  appearance:none !important;
  background:
    linear-gradient(180deg,var(--purple2),var(--purple)) !important;
  border:1px solid var(--acid-dim) !important;
  border-radius:7px !important;
  box-shadow:0 3px 8px rgba(0,0,0,.16) !important;

  color:var(--text) !important;
  font-family:var(--serif) !important;
  font-size:15px !important;
  font-weight:400 !important;
  line-height:1.2 !important;
  text-shadow:none !important;
  cursor:pointer !important;
}

#creazione-pozione button.action:hover{
  background:
    linear-gradient(180deg,#52265e,#3c1b47) !important;
  border-color:var(--acid) !important;
  color:#fff !important;
}

#creazione-pozione button.action.danger{
  background:transparent !important;
  border-color:var(--danger) !important;
  color:#e7a9b6 !important;
}

#creazione-pozione button.action.danger:hover{
  background:var(--danger-bg) !important;
  color:#ffd0da !important;
}

/* ---------- dadi / copia ---------- */

#creazione-pozione .dice-box,
#creazione-pozione .result-line{
  display:flex !important;
  align-items:center !important;
  flex-wrap:wrap !important;
  gap:10px !important;
  margin:12px 0 !important;
}

#creazione-pozione .dice-code{
  flex:1 1 420px !important;
  min-height:43px !important;
  padding:10px 12px !important;

  background:var(--bg2) !important;
  border:1px solid var(--line) !important;
  border-radius:6px !important;

  color:var(--acid-soft) !important;
  font-family:var(--mono) !important;
  font-size:12.5px !important;
  line-height:1.45 !important;
  overflow-wrap:anywhere !important;
}

#creazione-pozione button.copy-btn{
  flex:0 0 auto !important;
  min-width:76px !important;
  min-height:41px !important;
  margin:0 !important;
  padding:0 15px !important;

  appearance:none !important;
  background:rgba(53,22,63,.70) !important;
  border:1px solid var(--acid-dim) !important;
  border-radius:6px !important;
  box-shadow:none !important;

  color:var(--acid-soft) !important;
  font-family:var(--mono) !important;
  font-size:11px !important;
  text-transform:uppercase !important;
  letter-spacing:.04em !important;
  cursor:pointer !important;
}

#creazione-pozione button.copy-btn:hover{
  background:var(--purple2) !important;
  border-color:var(--acid) !important;
}

#creazione-pozione .result-line > span:first-child{
  color:var(--text-soft) !important;
  font-family:var(--serif) !important;
  font-size:14px !important;
}

#creazione-pozione .result-line input[type="number"]{
  flex:0 0 88px !important;
  width:88px !important;
  max-width:88px !important;
  text-align:center !important;
}

/* ---------- tag esito ---------- */

#creazione-pozione .out-tag{
  display:inline-block !important;
  padding:5px 11px !important;
  border:1px solid var(--line) !important;
  border-radius:18px !important;

  font-family:var(--mono) !important;
  font-size:11px !important;
  font-weight:400 !important;
  letter-spacing:.035em !important;
}

#creazione-pozione .out-ok{
  background:rgba(159,190,40,.09) !important;
  border-color:var(--acid) !important;
  color:var(--acid-soft) !important;
}

#creazione-pozione .out-fail{
  background:rgba(201,104,124,.09) !important;
  border-color:var(--danger) !important;
  color:#e7a9b6 !important;
}

#creazione-pozione .out-neutral{
  background:transparent !important;
  border-color:var(--line) !important;
  color:var(--text-dim) !important;
}

/* ---------- formule / note minori ---------- */

#creazione-pozione .formula-tag{
  display:inline-block !important;
  margin:5px 0 8px !important;
  padding:5px 9px !important;

  background:rgba(53,22,63,.52) !important;
  border:1px solid rgba(159,190,40,.33) !important;
  border-radius:6px !important;

  color:var(--text-soft) !important;
  font-family:var(--mono) !important;
  font-size:11.5px !important;
}

#creazione-pozione .small-note{
  margin:7px 0 12px !important;
  color:var(--text-dim) !important;
  font-size:13px !important;
  line-height:1.5 !important;
}



/* ---------- esito complessivo Preparazione Ingredienti ---------- */

#creazione-pozione .prep-summary-box{
  margin:18px 0 4px !important;
  padding:15px 17px !important;
  background:rgba(16,18,19,.55) !important;
  border:1px solid var(--line) !important;
  border-left:4px solid var(--acid) !important;
  border-radius:7px !important;
  color:var(--text-soft) !important;
  font-family:var(--serif) !important;
  line-height:1.55 !important;
}
#creazione-pozione .prep-summary-box.success{ background:rgba(159,190,40,.09) !important; border-left-color:var(--acid) !important; }
#creazione-pozione .prep-summary-box.fail{ background:rgba(201,104,124,.09) !important; border-left-color:var(--danger) !important; }
#creazione-pozione .prep-summary-box.warning{ background:rgba(184,156,193,.08) !important; border-left-color:var(--purple-soft) !important; }
#creazione-pozione .prep-summary-box .prep-main{ display:block !important; margin-bottom:5px !important; color:var(--text) !important; font-size:16px !important; }
#creazione-pozione .prep-summary-box.success .prep-main{ color:var(--acid-soft) !important; }
#creazione-pozione .prep-summary-box.fail .prep-main{ color:#ef9aab !important; }

#creazione-pozione .inventory-box{
  margin:20px 0 14px !important;
  padding:16px 17px !important;
  background:linear-gradient(90deg,rgba(53,22,63,.45),rgba(16,18,19,.76)) !important;
  border:1px solid var(--line) !important;
  border-left:4px solid var(--acid) !important;
  border-radius:8px !important;
}
#creazione-pozione .inventory-label{
  display:block !important;
  margin:0 0 10px !important;
  color:var(--acid-soft) !important;
  font-family:var(--mono) !important;
  font-size:11px !important;
  letter-spacing:.055em !important;
  text-transform:uppercase !important;
}
#creazione-pozione .inventory-sentence{
  width:100% !important;
  margin:0 !important;
  padding:14px 15px !important;
  background:#111415 !important;
  border:1px solid var(--line) !important;
  border-radius:6px !important;
  color:var(--text) !important;
  font-family:var(--serif) !important;
  font-size:15px !important;
  line-height:1.55 !important;
  overflow-wrap:anywhere !important;
}


/* ---------- Fatica / consapevolezza del calderone ---------- */

#creazione-pozione .fatigue-box{
  margin:20px 0 6px !important;
  padding:14px 16px !important;
  background:linear-gradient(90deg,rgba(53,22,63,.48),rgba(16,18,19,.58)) !important;
  border:1px solid var(--line) !important;
  border-left:4px solid var(--purple-soft) !important;
  border-radius:7px !important;
  color:var(--text-soft) !important;
  font-family:var(--serif) !important;
  font-size:14.5px !important;
  line-height:1.55 !important;
}

#creazione-pozione .fatigue-box b{
  color:var(--acid-soft) !important;
  font-size:16px !important;
}

#creazione-pozione .fatigue-box.zero{
  background:rgba(159,190,40,.08) !important;
  border-left-color:var(--acid) !important;
}

#creazione-pozione .awareness-box{
  margin:16px 0 8px !important;
  padding:15px 17px !important;
  background:rgba(53,22,63,.24) !important;
  border:1px solid var(--line) !important;
  border-left:4px solid var(--purple-soft) !important;
  border-radius:8px !important;
}

#creazione-pozione .awareness-box .awareness-title{
  margin:0 0 8px !important;
  color:var(--acid-soft) !important;
  font-family:var(--serif) !important;
  font-size:16px !important;
}


/* ---------- post finali Step 6 ---------- */

#creazione-pozione .final-posts-box{
  margin:14px 0 8px !important;
  padding:14px 16px !important;
  background:linear-gradient(90deg,rgba(159,190,40,.12),rgba(53,22,63,.22)) !important;
  border:1px solid rgba(159,190,40,.42) !important;
  border-left:4px solid var(--acid) !important;
  border-radius:7px !important;
  color:var(--text) !important;
  font-family:var(--serif) !important;
  font-size:15px !important;
  line-height:1.5 !important;
}

#creazione-pozione .final-posts-box b{
  color:var(--acid-soft) !important;
  font-size:17px !important;
}

#creazione-pozione .final-posts-box.fail{
  background:rgba(201,104,124,.09) !important;
  border-color:rgba(201,104,124,.55) !important;
  border-left-color:var(--danger) !important;
}

/* ---------- scheda riassuntiva finale ---------- */

#creazione-pozione .potion-summary{
  margin:18px 0 22px !important;
  padding:18px !important;
  background:
    linear-gradient(135deg,rgba(159,190,40,.08),rgba(53,22,63,.24)),
    var(--panel2) !important;

<script type="text/javascript"> 
(function(){ 
 "use strict"; 
 
 var EV = "cl" + "ick"; 
 
 /* ---------- STATO GLOBALE ---------- */ 
 var POZ = { 
 nome: "", 
 classificazione: "", 
 tierBase: false, 
 tierIV: false, 
 tierV: false,
 conoscenzaPosseduta: false,
 valigettaAdduco: false
 }; 
 
 var pgCounter = 0; 
 var pgs = []; 
 
 function newPG(){ 
 pgCounter = pgCounter + 1; 
 return { 
 id: pgCounter, 
 nome: "Personaggio", 
 tipo: "", 
 tecnica: null, 
 voto: "", 
 sapienzaPozionistica: null, 
 sapienzaAdulto: false, 
 speziale: "0", 
 chimico: "0", 
 toccoMagico: "0",

 manualita: "no",

 data: {} 
 }; 
 } 
 pgs.push(newPG()); 
 
 var steps = [ 
 { key:"info", label:"1. La Pozione" }, 
 { key:"pg", label:"2. Personaggio" }, 
 { key:"prep", label:"3. Preparazione Ingredienti" }, 
 { key:"prod", label:"4. Produzione" }, 
 { key:"bacchetta", label:"5. Uso della Bacchetta" }, 
 { key:"imbott", label:"6. Imbottigliamento e Pulizia" }, 
 { key:"distill", label:"7. Distillazione (facoltativa)" }, 
 { key:"riepilogo", label:"8. Riepilogo Finale" } 
 ]; 
 var currentStep = "info"; 
 
 /* ---------- HELPERS ---------- */ 
 var voto_bonus = { T:-3, D:-2, S:-1, A:0, O:1, E:2 }; 
 var voto_labels = ["T","D","S","A","O","E"]; 
 var voto_nomi = { T:"Troll", D:"Desolante", S:"Scadente", A:"Accettabile", O:"Oltre Ogni Previsione", E:"Eccezionale" };
 function votoNome(v){ return voto_nomi[v] ? (voto_nomi[v] + " (" + v + ")") : v; }
 
 function getVotoBonus(pg){ 
 if(pg.tipo === "adulto"){ return 0; } 
 return voto_bonus[pg.voto]; 
 } 
 
 function num(v, def){ 
 var n = parseFloat(v); 
 if(isNaN(n)){ return def; } 
 return n; 
 }

 function intInRange(v, min, max){
  if(v === "" || v === null || v === undefined){ return false; }
  var n = Number(v);
  return isFinite(n) && Math.floor(n) === n && n >= min && n <= max;
 }

 function nonNegativeInt(v){
  if(v === "" || v === null || v === undefined){ return false; }
  var n = Number(v);
  return isFinite(n) && Math.floor(n) === n && n >= 0;
 }

 function optionalNonNegativeInt(v){
  if(v === "" || v === null || v === undefined){ return true; }
  return nonNegativeInt(v);
 }

 function safeBonus(v){
  return nonNegativeInt(v) ? Number(v) : 0;
 }

 function positiveInt(v){
  if(v === "" || v === null || v === undefined){ return false; }
  var n = Number(v);
  return isFinite(n) && Math.floor(n) === n && n > 0;
 }

 function setupIssue(){
  var classi = ["X","XX","XXX","XXXX","XXXXX"];
  if(classi.indexOf(POZ.classificazione) === -1){ return "Seleziona la Classificazione della Pozione nello Step 1."; }
  if(!POZ.tierBase && !POZ.tierIV && !POZ.tierV){ return "Seleziona almeno una fascia di Ingredienti nello Step 1."; }
  if(!POZ.conoscenzaPosseduta){ return "Conferma nello Step 1 che il creatore possiede la Conoscenza della Pozione o la possiede tramite il Piano di Studi."; }
  if(!pgs.length){ return "Inserisci il Personaggio nello Step 2."; }
  var pg = pgs[0];
  if(pg.tipo !== "studente" && pg.tipo !== "adulto"){ return "Seleziona se il Personaggio è Studente o Adulto nello Step 2."; }
  if(!intInRange(pg.tecnica, 1, 20)){ return "Inserisci la Tecnica come intero da 1 a 20 nello Step 2."; }
  if(pg.tipo === "studente" && voto_labels.indexOf(pg.voto) === -1){ return "Seleziona il voto scolastico in Pozioni nello Step 2."; }
  if(pg.tipo === "studente"){
   var advFields = ["speziale","chimico","toccoMagico","calderaio","distillatore"];
   for(var ai=0; ai<advFields.length; ai++){
    var lv = pg[advFields[ai]];
    if(lv !== "0" && lv !== "I"){ return "Uno Studente può possedere soltanto il livello I della Sapienza: le Conoscenze Avanzate devono essere assenti oppure al livello I."; }
   }
  }
  if(pg.tipo === "adulto" && !intInRange(pg.sapienzaPozionistica, 0, 25)){ return "Inserisci la Sapienza Pozionistica dell'Adulto come intero da 0 a 25 nello Step 2."; }
  return "";
 }

 function appendSetupGate(panel){
  var issue = setupIssue();
  if(!issue){ return false; }
  panel.appendChild(el("div", "guide-text", "<b>Dati iniziali incompleti.</b> " + issue + " I calcoli restano bloccati per evitare risultati ottenuti con valori impliciti."));
  return true;
 }

 function phaseDependencyIssue(step, pg){
  if(!pg){ return "Inserisci prima il Personaggio."; }
  if(step === "prod"){
    var tiers = getTiersPresentList();
    var prep = computePrepAccumulo(pg, tiers);
    if(!prep.complete){ return "Completa tutti i risultati della Preparazione degli Ingredienti prima di passare alla Produzione."; }
  }
  if(step === "bacchetta"){
    var ps = pgDataGet(pg, "prod_status", "pending");
    if(ps !== "success" && ps !== "fail"){ return "Completa la Produzione prima di usare la Bacchetta."; }
  }
  if(step === "imbott"){
    var bs = pgDataGet(pg, "bac_status", "pending");
    if(bs !== "success" && bs !== "fail"){ return "Completa l'Uso della Bacchetta prima dell'Imbottigliamento e Pulizia del Calderone."; }
  }
  if(step === "distill"){
    var ie = pgDataGet(pg, "imb_esito", "");
    var ist = pgDataGet(pg, "imb_status", "pending");
    if(ist !== "done" || (ie !== "33%" && ie !== "66%" && ie !== "100%")){
      return "La Distillazione è disponibile soltanto dopo una creazione conclusa con Imbottigliamento/Pulizia diverso da 0%.";
    }
  }
  if(step === "riepilogo"){
    var rie = pgDataGet(pg, "imb_esito", "");
    var rist = pgDataGet(pg, "imb_status", "pending");
    if(rist !== "done"){ return "Completa l'Imbottigliamento e Pulizia del Calderone prima del Riepilogo Finale."; }
    if(rie === "0%"){ return "La Pozione è andata persa per l'esplosione del calderone: non esiste un risultato finale da registrare."; }
    if(!!pgDataGet(pg, "distill_destroyed", false)){ return "La Pozione è esplosa durante il tentativo di ripetere la Distillazione: non esiste un risultato finale da registrare."; }
  }
  return "";
 }

 function appendDependencyGate(panel, step){
  var pg = pgs.length ? pgs[0] : null;
  var issue = phaseDependencyIssue(step, pg);
  if(!issue){ return false; }
  panel.appendChild(el("div", "guide-text", "<b>Fase precedente non conclusa.</b> " + issue));
  return true;
 } 
 
 function el(tag, cls, html){ 
 var e = document.createElement(tag); 
 if(tag === "button"){ e.type = "button"; } 
 if(cls){ e.className = cls; } 
 if(html !== undefined){ e.innerHTML = html; } 
 return e; 
 } 
 
 function setText(id, txt){ 
 var e = document.getElementById(id); 
 if(e){ e.textContent = txt; } 
 } 
 
 function flashCopied(btn, ok){ 
 var old = btn.getAttribute("data-orig") || btn.textContent; 
 btn.setAttribute("data-orig", old); 
 btn.textContent = ok ? "Copiato!" : "Copia manualmente"; 
 setTimeout(function(){ btn.textContent = old; }, 1600); 
 } 
 
 function selectSourceText(src){ 
 try{ 
 var range = document.createRange(); 
 range.selectNodeContents(src); 
 var sel = window.getSelection(); 
 sel.removeAllRanges(); 
 sel.addRange(range); 
 return true; 
 }catch(e){ 
 return false; 
 } 
 } 
 
 function fallbackCopyText(txt){ 
 var ta = document.createElement("textarea"); 
 ta.value = txt; 
 ta.setAttribute("readonly", ""); 
 ta.style.position = "fixed"; 
 ta.style.top = "0"; 
 ta.style.left = "-9999px"; 
 document.body.appendChild(ta); 
 ta.focus(); 
 ta.select(); 
 ta.setSelectionRange(0, txt.length); 
 var ok = false; 
 try{ 
 ok = document.execCommand("copy"); 
 } catch(e){ 
 ok = false; 
 } 
 document.body.removeChild(ta); 
 return ok; 
 } 
 
 function attachCopy(btnId, sourceId){ 
 var btn = document.getElementById(btnId); 
 if(!btn){ return; } 
 btn.addEventListener(EV, function(){ 
 var src = document.getElementById(sourceId); 
 if(!src){ flashCopied(btn, false); return; } 
 var txt = src.textContent; 
 var handledAsync = false; 
 if(navigator.clipboard){ 
 if(navigator.clipboard.writeText){ 
 handledAsync = true; 
 navigator.clipboard.writeText(txt).then(function(){ 
 flashCopied(btn, true); 
 }).catch(function(){ 
 var ok = fallbackCopyText(txt); 
 if(!ok){ selectSourceText(src); } 
 flashCopied(btn, ok); 
 }); 
 } 
 } 
 if(!handledAsync){ 
 var ok2 = fallbackCopyText(txt); 
 if(!ok2){ selectSourceText(src); } 
 flashCopied(btn, ok2); 
 } 
 }); 
 } 
 
 function attachCopyPlain(btnId, sourceId){ 
 var btn = document.getElementById(btnId); 
 if(!btn){ return; } 
 btn.addEventListener(EV, function(){ 
 var src = document.getElementById(sourceId); 
 var txt = src.getAttribute("data-plain"); 
 if(!txt){ txt = src.textContent; } 
 var handledAsync = false; 
 if(navigator.clipboard){ 
 if(navigator.clipboard.writeText){ 
 handledAsync = true; 
 navigator.clipboard.writeText(txt).then(function(){ 
 flashCopied(btn, true); 
 }).catch(function(){ 
 var ok = fallbackCopyText(txt); 
 if(!ok){ selectSourceText(src); } 
 flashCopied(btn, ok); 
 }); 
 } 
 } 
 if(!handledAsync){ 
 var ok2 = fallbackCopyText(txt); 
 if(!ok2){ selectSourceText(src); } 
 flashCopied(btn, ok2); 
 } 
 }); 
 } 
 
 function pgDataGet(pg, key, def){ 
 if(pg.data[key] === undefined){ return def; } 
 return pg.data[key]; 
 }

function sapienzaPozionisticaValue(pg){
 var fallback = pg.sapienzaAdulto ? 1 : 0;
 var v = num(pg.sapienzaPozionistica, fallback);
 if(v < 0){ v = 0; }
 if(v > 25){ v = 25; }
 return v;
 }

function haSapienzaPozionistica(pg){
 return pg.tipo === "adulto" && sapienzaPozionisticaValue(pg) > 0;
 }

function haSapienzaPozionistica25(pg){
 return pg.tipo === "adulto" && sapienzaPozionisticaValue(pg) >= 25;
 }

function faticaFaseNumero(pg, fase){
 if(fase === "prep"){ return 0.5; }
 if(haSapienzaPozionistica25(pg)){
   if(fase === "prod" || fase === "bacchetta" || fase === "imbott"){ return 0; }
 }
 if(fase === "prod"){ return 1; }
 if(fase === "bacchetta"){ return 0.5; }
 if(fase === "imbott"){ return 2; }
 return 0;
 }

function extraUseKey(field){ return field + "Usata"; }
function extraIsUsed(pg, field){ return !!pg[extraUseKey(field)]; }

function faticaExtraFaseNumero(pg, fase){
 if(fase === "prep" && extraIsUsed(pg,"manualita")){ return 1.5; }
 if(fase === "prod" && extraIsUsed(pg,"memoria")){ return 1.5; }
 if(fase === "imbott" && extraIsUsed(pg,"sintesi")){ return 2; }
 return 0;
 }

function faticaExtraTotale(pg){
 return faticaExtraFaseNumero(pg,"prep") +
        faticaExtraFaseNumero(pg,"prod") +
        faticaExtraFaseNumero(pg,"imbott");
 }

function fmtFatica(n){
 var s = String(n);
 if(s.indexOf(".5") !== -1){ s = s.replace(".5", ",5"); }
 return s;
 }

function faticaFaseTesto(pg, fase){
 if(fase === "distill"){
   var eff = pgDataGet(pg, "distill_eff", "skip");
   if(eff === "skip"){ return "0 Fatica — Distillazione non svolta."; }
   if(haSapienzaPozionistica25(pg)){ return "0 Fatica — Sapienza Pozionistica 25."; }
   var att = Number(pgDataGet(pg, "distill_attempts", 1));
   if(!isFinite(att) || att < 1){ att = 1; }
   return "-" + att + " Fatica per la dose calcolata (" + att + (att === 1 ? " tentativo" : " tentativi") + ").";
 }
 var base = faticaFaseNumero(pg, fase);
 var extra = faticaExtraFaseNumero(pg, fase);
 var totale = base + extra;
 var parti = [];
 if(base === 0){ parti.push("fase 0 per Sapienza Pozionistica 25"); }
 else { parti.push("fase -" + fmtFatica(base)); }
 if(extra > 0){
   var nomeExtra = fase === "prep" ? "Manualità Tecnica+" : (fase === "prod" ? "Memoria Tecnica+" : "Sintesi Tecnica+");
   parti.push(nomeExtra + " -" + fmtFatica(extra));
 }
 return "-" + fmtFatica(totale) + " Fatica totale (" + parti.join("; ") + ").";
 }

function buildFaticaBox(pg, fase){
 var zero = (fase !== "prep" && haSapienzaPozionistica25(pg) && faticaExtraFaseNumero(pg,fase) === 0);
 var box = el("div", "fatigue-box" + (zero ? " zero" : ""));
 box.id = "fatigue-" + fase + "-" + pg.id;
 var labels = {
   prep:"Preparazione degli Ingredienti",
   prod:"Produzione",
   bacchetta:"Uso della Bacchetta",
   imbott:"Imbottigliamento e Pulizia",
   distill:"Distillazione"
 };
 box.innerHTML = "<b>Fatica — " + labels[fase] + ":</b> " + faticaFaseTesto(pg, fase);
 return box;
 }

function updateFaticaBox(pg, fase){
 var box = document.getElementById("fatigue-" + fase + "-" + pg.id);
 if(!box){ return; }
 var zero = (fase !== "prep" && haSapienzaPozionistica25(pg) && faticaExtraFaseNumero(pg,fase) === 0);
 box.className = "fatigue-box" + (zero ? " zero" : "");
 var labels = {
   prep:"Preparazione degli Ingredienti",
   prod:"Produzione",
   bacchetta:"Uso della Bacchetta",
   imbott:"Imbottigliamento e Pulizia",
   distill:"Distillazione"
 };
 box.innerHTML = "<b>Fatica — " + labels[fase] + ":</b> " + faticaFaseTesto(pg, fase);
 }

function faticaObbligatoriaTotale(pg){
 return faticaFaseNumero(pg,"prep") +
        faticaFaseNumero(pg,"prod") +
        faticaFaseNumero(pg,"bacchetta") +

 }

function renderNav(){ 
 var nav = document.getElementById("stepsNav"); 
 nav.innerHTML = ""; 
 
 for(var i = 0; i < steps.length; i++){ 
 (function(s){ 
 var b = el( 
 "button", 
 "step-btn" + (s.key === currentStep ? " active" : ""), 
 s.label 
 ); 
 if(s.key === currentStep){ b.setAttribute("aria-current", "step"); } 
 
 b.addEventListener(EV, function(){ 
 currentStep = s.key; 
 renderAll(); 
 }); 
 
 nav.appendChild(b); 
 })(steps[i]); 
 } 
} 
 
 function normalizePGProfile(pg){
  if(!pg || pg.tipo !== "studente"){ return; }
  var advFields = ["speziale","chimico","toccoMagico","calderaio","distillatore"];
  var anyLevelI = false;
  for(var i=0;i<advFields.length;i++){
   var f = advFields[i];
   if(pg[f] !== "0" && pg[f] !== "I"){ pg[f] = "0"; }
   if(pg[f] === "I"){ anyLevelI = true; }
  }
  /* Uno Studente può possedere soltanto Sapienza I: non deve trascinarsi dietro
     un vecchio valore Adulto (es. 25) mentre il campo è nascosto. */
  pg.sapienzaPozionistica = anyLevelI ? 1 : null;
  pg.sapienzaAdulto = false;
 }

 function ruleConfigSignature(){
 var pg = pgs.length ? pgs[0] : null;
 var parts = [
  POZ.classificazione, POZ.tierBase ? 1 : 0, POZ.tierIV ? 1 : 0, POZ.tierV ? 1 : 0, POZ.conoscenzaPosseduta ? 1 : 0
 ];
 if(pg){
  parts = parts.concat([
   pg.tipo, pg.tecnica, pg.voto, pg.sapienzaPozionistica,
   pg.speziale, pg.chimico, pg.toccoMagico, pg.calderaio, pg.distillatore
  ]);
 }
 return parts.join("|");
}

var lastRuleConfigSignature = null;
function invalidateStaleResultsIfNeeded(){
 var sig = ruleConfigSignature();
 if(lastRuleConfigSignature !== null && sig !== lastRuleConfigSignature){
  for(var i=0;i<pgs.length;i++){ pgs[i].data = {}; }
 }
 lastRuleConfigSignature = sig;
}

function renderAll(){
 if(pgs.length){ normalizePGProfile(pgs[0]); }
 invalidateStaleResultsIfNeeded();
 var c = document.getElementById("stepContainer");
 try{
  renderNav();
  c.innerHTML = "";
  if(currentStep === "info"){ renderInfoStep(c); }
  if(currentStep === "pg"){ renderPGStep(c); }
  if(currentStep === "prep"){ renderPrepStep(c); }
  if(currentStep === "prod"){ renderProdStep(c); }
  if(currentStep === "bacchetta"){ renderBacchettaStep(c); }

 }

 function extraEfficaciaFromD10(pg, roll){
 if(pg.tipo === "adulto"){
  if(haSapienzaPozionistica(pg)){ return "100"; }
  if(roll === 1){ return "0"; }
  if(roll === 2){ return "33"; }
  if(roll === 3){ return "66"; }
  return "100";
 }
 var v = pg.voto;
 if(v === "T"){
  if(roll <= 7){ return "0"; }
  if(roll <= 9){ return "33"; }
  return "66";
 }
 if(v === "D"){
  if(roll <= 5){ return "0"; }
  if(roll <= 7){ return "33"; }
  if(roll <= 9){ return "66"; }
  return "100";
 }
 if(v === "S"){
  if(roll <= 3){ return "0"; }
  if(roll <= 5){ return "33"; }
  if(roll <= 8){ return "66"; }
  return "100";
 }
 if(v === "A"){
  if(roll <= 2){ return "0"; }
  if(roll <= 4){ return "33"; }
  if(roll <= 6){ return "66"; }
  return "100";
 }
 if(v === "O"){
  if(roll === 1){ return "0"; }
  if(roll <= 3){ return "33"; }
  if(roll <= 5){ return "66"; }
  return "100";
 }
 if(v === "E"){
  if(roll === 1){ return "0"; }
  if(roll === 2){ return "33"; }
  if(roll <= 4){ return "66"; }
  return "100";
 }
 return "pending";
 }

 function levelNum(lvl){

 /* ---------- CONSEGUENZE: bonus/malus Forza e Durata ---------- */ 
 
 function prepForzaBonusPercent(pg){
 var map = { I:20, II:25, III:30, IV:35, V:40 };
 if(levelNum(pg.speziale) > 0){ return map[pg.speziale]; }
 if(pg.tipo === "studente"){
  if(pg.voto === "O"){ return 5; }
  if(pg.voto === "E"){ return 10; }
  return 2;
 }
 return 15;
 } 
 
 function prepMalusPercent(pg){ 
 var base; 
 if(pg.tecnica <= 5){ base = 65; } 
 else if(pg.tecnica <= 10){ base = 60; } 
 else if(pg.tecnica <= 15){ base = 55; } 
 else { base = 50; } 
 var reduction = 0; 
 var map = { I:5, II:10, III:15, IV:20, V:25 }; 
 if(pg.speziale !== "0"){ reduction = map[pg.speziale]; } 
 var result = base - reduction; 
 if(result < 0){ result = 0; } 
 return result; 
 } 
 
 function accorgersiPrepSoglia(pg){ 
 // possibilita' su 10 di accorgersi dell'errore in Preparazione 
 var base = 5; 
 var map = { I:1, II:2, III:3, IV:4 }; 
 if(pg.speziale !== "0"){ 
 if(pg.speziale !== "V"){ 
 base = base + map[pg.speziale]; 
 } 
 } 
 if(base > 10){ base = 10; } 
 return base; 
 } 
 
 function accorgersiPrepSogliaAiutante(speziale){ 
 var base = 5; 
 var map = { I:1, II:2, III:3, IV:4 }; 
 if(speziale !== "0" && speziale !== "V"){ 
 base = base + map[speziale]; 
 } 
 if(base > 10){ base = 10; } 
 return base; 
 } 

 function prodForzaBonusPercent(pg){
 var map = { I:20, II:25, III:30, IV:35, V:40 };
 if(levelNum(pg.chimico) > 0){ return map[pg.chimico]; }
 if(pg.tipo === "studente"){
  if(pg.voto === "O"){ return 5; }
  if(pg.voto === "E"){ return 10; }
  return 2;
 }
 return 15;
 } 
 
 function prodMalusPercent(pg){ 
 var base; 
 if(pg.tecnica <= 5){ base = 80; } 
 else if(pg.tecnica <= 10){ base = 70; } 
 else if(pg.tecnica <= 15){ base = 60; } 
 else { base = 50; } 
 var reduction = 0; 
 var map = { I:5, II:10, III:15, IV:20, V:25 }; 
 if(pg.chimico !== "0"){ reduction = map[pg.chimico]; } 
 var result = base - reduction; 
 if(result < 0){ result = 0; } 
 return result; 
 }

 function computePrepAccumulo(pg, tiersList){ 
 var allSuccess = true; 
 var anyUnremFail = false; 
 var anyIncomplete = false; 
 if(tiersList.length === 0){ allSuccess = false; anyIncomplete = true; } 
 for(var i=0;i<tiersList.length;i++){ 
 var st = pgDataGet(pg, "prep_status_" + tiersList[i], "pending"); 
 if(st === "pending" || st === "invalid"){ anyIncomplete = true; } 
 if(st === "fail_pending"){ anyIncomplete = true; } 
 if(st !== "success"){ allSuccess = false; } 
 if(st === "fail_unremediated"){ anyUnremFail = true; } 
 } 
 var forza = 0; 
 var durata = 0; 
 if(allSuccess){ forza = prepForzaBonusPercent(pg); } 
 if(anyUnremFail){ durata = 0 - prepMalusPercent(pg); } 
 return { forza: forza, durata: durata, complete: !anyIncomplete, allSuccess: allSuccess }; 
 } 
 
 function computeProdAccumulo(pg){ 
 var status = pgDataGet(pg, "prod_status", "pending"); 
 var forza = 0; 
 if(status === "success"){ forza = prodForzaBonusPercent(pg); } 
 if(status === "fail"){ forza = 0 - prodMalusPercent(pg); } 
 return { forza: forza, complete: status === "success" || status === "fail" }; 
 } 
 
 function computeDosiFinali(pg){ 
 var dosiBase = pgDataGet(pg, "dosi_base_total", null); 
 var bacStatus = pgDataGet(pg, "bac_status", "pending"); 
 if(dosiBase === null){ 
 return { finale: null, testo: "da calcolare (tira ancora il dado delle Dosi)" }; 
 } 
 var finale = dosiBase; 
 var testo = "" + dosiBase + " (base)"; 
 if(bacStatus === "fail"){ 
 finale = finale - 1; 
 if(finale < 0){ finale = 0; } 
 testo = "" + finale + " (base " + dosiBase + ", -1 per fallimento dell'Uso della Bacchetta)"; 
 } else if(bacStatus === "success"){ 
 testo = "" + finale + " (base " + dosiBase + ", nessuna penalità: Uso della Bacchetta riuscito)"; 
 } else if(bacStatus === "invalid"){
 return { finale:null, testo:"correggi prima il risultato impossibile dell'Uso della Bacchetta" };
 } else { 
 return { finale:null, testo:"provvisorio: dipende dall'esito dell'Uso della Bacchetta qui sopra" };
 } 
 return { finale: finale, testo: testo }; 
 }

 function extraBonusStatic(pg, field, efficacia){
 // Manualità/Memoria: ritorna bonus OFFGame dopo la risoluzione dell'Efficacia
 if(!extraIsUsed(pg,field)){ return { fixed:0, diceFaces:0, ready:true }; }
 var eff = normalizeExtraEfficacia(pg,field);
 if(eff === "pending"){ return { fixed:0, diceFaces:0, ready:false }; }
 if(eff === "0"){ return { fixed:0, diceFaces:0, ready:true }; }
 if(pg.tipo === "studente"){
  if(eff === "100"){ return { fixed:2, diceFaces:0, ready:true }; }
  if(eff === "66"){ return { fixed:0, diceFaces:2, ready:true }; }
  if(eff === "33"){ return { fixed:1, diceFaces:0, ready:true }; }
 } else {
  if(haSapienzaPozionistica(pg)){
   if(eff === "100"){ return { fixed:3, diceFaces:0, ready:true }; }
   return { fixed:0, diceFaces:0, ready:false };
  }
  if(eff === "100"){ return { fixed:1, diceFaces:2, ready:true }; }
  if(eff === "66"){ return { fixed:0, diceFaces:3, ready:true }; }
  if(eff === "33"){ return { fixed:0, diceFaces:2, ready:true }; }
 }
 return { fixed:0, diceFaces:0, ready:false };
 }

 function calcPrepTier(pg, tier){
 var tecBase = tecnicaBasePrep(pg.tecnica);
 var d6 = pgDataGet(pg, "prep_d6", "");
 var competenzaB = 0;
 var ready = true;
 var waiting = [];

 if(levelNum(pg.speziale) > 0){
   competenzaB = levelNum(pg.speziale);
 } else if(pg.tipo === "studente"){
   competenzaB = getVotoBonus(pg);
 } else {
   if(intInRange(d6,1,6)){ competenzaB = Number(d6) - 4; }
   else { ready = false; waiting.push("1d6 Adulto senza Speziale"); }
 }

 var classB = tierBonusPrep(tier.key);

 var extraObj = extraBonusStatic(pg, "manualita", pg.manualita);
 var manFixed = extraObj.fixed;

 if(!extraObj.ready){
   manFixed = 0; ready = false; waiting.push("1d10 Efficacia Manualità Tecnica+");
 } else if(extraObj.diceFaces > 0){
   var dv = pgDataGet(pg, "prep_man_dice", "");
   if(intInRange(dv,1,extraObj.diceFaces)){
     manFixed = manFixed + Number(dv);
   } else {
     manFixed = 0; ready = false; waiting.push("dado Manualità Tecnica+");
   }
 }

 var extraManual = safeBonus(pgDataGet(pg, "prep_extra_" + tier.key, 0));

 var votoTotale = competenzaB;
 var extraTotale = manFixed + extraManual;
 var total = tecBase + votoTotale + classB + extraTotale;

 if(total > 14){ total = 14; }
 if(total < 0){ total = 0; }

 return {
   tecBase: tecBase,
   votoTotale: votoTotale,
   classB: classB,
   extraTotale: extraTotale,
   total: total,
   ready: ready,
   waiting: waiting
 };
 }

 function recomputePrepTier(pg, tier){
 var calc = calcPrepTier(pg, tier);
 var tecBase = calc.tecBase, votoTotale = calc.votoTotale, classB = calc.classB, extraTotale = calc.extraTotale, total = calc.total;
 var formulaEl = document.getElementById("prep-formula-" + tier.key + "-" + pg.id); 
 if(formulaEl){ formulaEl.textContent = "Tecnica " + tecBase + " + Voto/Speziale " + votoTotale + " + Classificazione " + classB + " + Extra " + extraTotale + " = " + total + " su 14"; } 
 var codeEl = document.getElementById("prep-code-" + tier.key + "-" + pg.id); if(codeEl){ codeEl.textContent = prepDiceText(pg, tier, calc); }
 var tagEl = document.getElementById("prep-tag-" + tier.key + "-" + pg.id); 
 var conseqEl = document.getElementById("prep-conseq-" + tier.key + "-" + pg.id); 
 var remedWrapEl = document.getElementById("prep-remedio-wrap-" + tier.key + "-" + pg.id);
 var retryWrapEl = document.getElementById("prep-retry-wrap-" + tier.key + "-" + pg.id);
 var tierStatus = "pending"; 
 var resV = pgDataGet(pg, "prep_result_" + tier.key, "");
 var prepCopy = document.getElementById("prep-copy-" + tier.key + "-" + pg.id);
 var prepResultInput = document.getElementById("prep-result-" + tier.key + "-" + pg.id);
 if(prepCopy){ prepCopy.disabled = calc.ready === false; }
 if(prepResultInput){ prepResultInput.disabled = calc.ready === false; }
 if(retryWrapEl){ retryWrapEl.style.display = "none"; retryWrapEl.innerHTML = ""; }

 if(calc.ready === false){
   if(formulaEl){ formulaEl.textContent = "In attesa: " + calc.waiting.join(", ") + "."; }
   if(tagEl){ tagEl.textContent = "Bloccato"; tagEl.className = "out-tag out-neutral"; }
   if(conseqEl){ conseqEl.textContent = "Completa prima i dadi ausiliari richiesti."; }
   if(remedWrapEl){ remedWrapEl.style.display = "none"; }
   pg.data["prep_status_" + tier.key] = "pending"; refreshPrepAccumulo(pg); return;
 }
 if(total >= 14){ 
   tierStatus = "success"; 
   if(tagEl){ tagEl.textContent = "Automaticamente riuscita"; tagEl.className = "out-tag out-ok"; } 
   if(conseqEl){ conseqEl.textContent = "Ingredienti preparati correttamente."; } 
   if(remedWrapEl){ remedWrapEl.style.display = "none"; } 
 } else if(resV === ""){ 
   tierStatus = "pending"; 
   if(tagEl){ tagEl.textContent = "in attesa"; tagEl.className = "out-tag out-neutral"; } 
   if(conseqEl){ conseqEl.textContent = ""; } 
   if(remedWrapEl){ remedWrapEl.style.display = "none"; } 
 } else if(!intInRange(resV,1,14)){
   tierStatus = "invalid";
   if(tagEl){ tagEl.textContent = "Risultato impossibile"; tagEl.className = "out-tag out-fail"; }
   if(conseqEl){ conseqEl.textContent = "Inserisci un risultato intero compreso fra 1 e 14."; }
   if(remedWrapEl){ remedWrapEl.style.display = "none"; }
 } else if(Number(resV) <= total){ 
   tierStatus = "success"; 
   if(tagEl){ tagEl.textContent = "Riuscita"; tagEl.className = "out-tag out-ok"; } 
   if(conseqEl){ conseqEl.textContent = "Ingredienti preparati correttamente."; } 
   if(remedWrapEl){ remedWrapEl.style.display = "none"; } 
 } else {
   if(tagEl){ tagEl.textContent = "Fallita"; tagEl.className = "out-tag out-fail"; }
   if(remedWrapEl){ remedWrapEl.style.display = "block"; }

   var selfPending=false, selfSuccess=false, helpPending=false, helpSuccess=false;
   var helpEnabled=!!pgDataGet(pg,"prep_help_enabled_"+tier.key,false);
   var helperName=pgDataGet(pg,"prep_help_name_"+tier.key,"") || "Il PG aiutante";
   var noticedBy="";

   if(pg.speziale === "V"){
     selfSuccess=true; noticedBy=pg.nome+" (Speziale V)";
   } else {
     var accResV=pgDataGet(pg,"prep_acc_result_"+tier.key,"");
     var soglia=accorgersiPrepSoglia(pg);
     var accTagEl=document.getElementById("prep-acc-tag-"+tier.key+"-"+pg.id);
     if(accResV===""){ selfPending=true; if(accTagEl){accTagEl.textContent="in attesa";accTagEl.className="out-tag out-neutral";} }
     else if(!intInRange(accResV,1,10)){ selfPending=true; if(accTagEl){accTagEl.textContent="Risultato impossibile";accTagEl.className="out-tag out-fail";} }
     else { selfSuccess=Number(accResV)<=soglia; if(accTagEl){accTagEl.textContent=selfSuccess?"Se ne accorge":"Non se ne accorge";accTagEl.className=selfSuccess?"out-tag out-ok":"out-tag out-fail";} }

     var helperSpec=pgDataGet(pg,"prep_help_speziale_"+tier.key,"0");
     var helpTagEl=document.getElementById("prep-help-tag-"+tier.key+"-"+pg.id);
     if(helpEnabled){
       if(helperSpec==="V"){ helpSuccess=true; if(helpTagEl){helpTagEl.textContent="Si accorge dell'errore";helpTagEl.className="out-tag out-ok";} }
       else {
         var helpSoglia=accorgersiPrepSogliaAiutante(helperSpec);
         var helpResV=pgDataGet(pg,"prep_help_acc_result_"+tier.key,"");
         var helpCodeEl=document.getElementById("prep-help-code-"+tier.key+"-"+pg.id);
         if(helpCodeEl){helpCodeEl.textContent="[dice=1d10]Aiuto nella Preparazione Ingredienti - "+helperName+" controlla l'errore di "+pg.nome+" ("+tier.label+", riesce se 1-"+helpSoglia+")[/dice]";}
         if(helpResV===""){helpPending=true;if(helpTagEl){helpTagEl.textContent="in attesa";helpTagEl.className="out-tag out-neutral";}}
         else if(!intInRange(helpResV,1,10)){helpPending=true;if(helpTagEl){helpTagEl.textContent="Risultato impossibile";helpTagEl.className="out-tag out-fail";}}
         else {helpSuccess=Number(helpResV)<=helpSoglia;if(helpTagEl){helpTagEl.textContent=helpSuccess?"Si accorge dell'errore":"Non se ne accorge";helpTagEl.className=helpSuccess?"out-tag out-ok":"out-tag out-fail";}}
       }
     }
     if(selfSuccess&&helpSuccess){noticedBy=pg.nome+" e "+helperName;} else if(selfSuccess){noticedBy=pg.nome;} else if(helpSuccess){noticedBy=helperName;}
   }

   if(selfSuccess || helpSuccess){
     renderPrepRetryUI(pg,tier,calc,noticedBy);
     var retryV=pgDataGet(pg,"prep_retry_result_"+tier.key,"");
     var retryTag=document.getElementById("prep-retry-tag-"+tier.key+"-"+pg.id);
     if(retryV===""){
       tierStatus="fail_pending";
       if(conseqEl){conseqEl.textContent="Errore individuato: sostituisci gli Ingredienti danneggiati e ripeti il d14 per tentare il rimedio. Il bonus pieno alla Forza è comunque perso.";}
     } else if(!intInRange(retryV,1,14)){
       tierStatus="fail_pending";
       if(retryTag){retryTag.textContent="Risultato impossibile";retryTag.className="out-tag out-fail";}
       if(conseqEl){conseqEl.textContent="Il tiro di rimedio deve essere un intero da 1 a 14.";}
     } else if(Number(retryV)<=total){
       tierStatus="fail_remediated";
       if(retryTag){retryTag.textContent="Rimedio riuscito";retryTag.className="out-tag out-ok";}
       if(conseqEl){conseqEl.textContent="Il nuovo d14 riesce: nessun malus alla Durata. Il bonus pieno alla Forza resta perso perché la procedura era fallita almeno una volta.";}
     } else {
       tierStatus="fail_unremediated";
       if(retryTag){retryTag.textContent="Rimedio fallito";retryTag.className="out-tag out-fail";}
       if(conseqEl){conseqEl.textContent="Anche il tentativo di rimedio fallisce: si applica -"+prepMalusPercent(pg)+"% alla Durata degli effetti e dei bonus/malus. Il regolamento non specifica ulteriori tentativi automatici in questa procedura.";}
     }
   } else if(selfPending || (helpEnabled && helpPending)){
     tierStatus="fail_pending";
     if(conseqEl){conseqEl.textContent="Preparazione fallita. Occorre prima stabilire se il PG che prepara o l'eventuale aiutante si accorge dell'errore. Solo dopo un esito positivo si può sostituire l'Ingrediente e ripetere il d14.";}
   } else {
     tierStatus="fail_unremediated";
     if(conseqEl){conseqEl.textContent="Nessuno si accorge dell'errore: malus di -"+prepMalusPercent(pg)+"% sulla Durata degli effetti e dei bonus/malus della Pozione.";}
   }
 }
 pg.data["prep_status_"+tier.key]=tierStatus;
 refreshPrepAccumulo(pg);
 }

 function recomputeProd(pg){ 
 var tecBase = pg.tecnica; 
 var chimicoB = chimicoBonusFixed(pg); 
 var classB = classBonusProd(POZ.classificazione); 
 var memExtra = extraBonusStatic(pg, "memoria", pg.memoria); 
 var memFixed = memExtra.fixed;
 var prodReady = memExtra.ready !== false; 
 if(memExtra.ready !== false && memExtra.diceFaces > 0){ 
 var dv = pgDataGet(pg, "prod_mem_dice", ""); 
 if(intInRange(dv,1,memExtra.diceFaces)){ memFixed = memFixed + Number(dv); } else { memFixed = 0; prodReady = false; } 
 } 
 var extraManual = safeBonus(pgDataGet(pg, "prod_extra", 0)); 
 
 var total = tecBase + chimicoB + classB + memFixed + extraManual; 
 if(total > 30){ total = 30; } 
 if(total < 0){ total = 0; } 
 
 var formulaEl = document.getElementById("prod-formula-" + pg.id); 
 if(formulaEl){ 
 formulaEl.textContent = "Tecnica " + tecBase + " + Voto/Chimico " + chimicoB + " + Classificazione " + classB + 
 " + Extra " + (memFixed+extraManual) + " = " + total + " su 30"; 
 } 
 
 var codeEl = document.getElementById("prod-code-" + pg.id); 
 if(codeEl){ 
 codeEl.textContent = "[dice=1d30]Produzione Pozione - " + pg.nome + 
 " (Riesce se 1-" + total + ": Tecnica " + tecBase + " + Voto/Chimico " + chimicoB + 
 " + Classificazione " + classB + " + Extra " + (memFixed+extraManual) + " = " + total + " su 30)[/dice]"; 
 } 
 
 var tagEl = document.getElementById("prod-tag-" + pg.id); 
 var conseqEl = document.getElementById("prod-conseq-" + pg.id);
 var prodCopy = document.getElementById("prod-copy-" + pg.id);
 var prodResInput = document.getElementById("prod-result-" + pg.id);
 if(prodCopy){ prodCopy.disabled = !prodReady; }
 if(prodResInput){ prodResInput.disabled = !prodReady; }
 var status = "pending";
 if(!prodReady){
   if(formulaEl){ formulaEl.textContent = "In attesa del dado richiesto da Memoria Tecnica+."; }
   if(codeEl){ codeEl.textContent = "Completa prima il dado di Memoria Tecnica+."; }
   if(tagEl){ tagEl.textContent = "Bloccato"; tagEl.className = "out-tag out-neutral"; }
   if(conseqEl){ conseqEl.textContent = ""; }
   pg.data["prod_status"] = "pending"; return;
 } 
 var bonusP = prodForzaBonusPercent(pg); 
 var malusP = prodMalusPercent(pg); 
 if(tagEl){ 
 var resV = pgDataGet(pg, "prod_result", ""); 
 if(resV === "" ){ 
 if(total >= 30){ 
 tagEl.textContent = "Automaticamente riuscita"; 
 tagEl.className = "out-tag out-ok"; 
 status = "success"; 
 if(conseqEl){ conseqEl.textContent = "Produzione riuscita: bonus di +" + bonusP + "% sulla Forza finale della Pozione."; } 
 } else { 
 tagEl.textContent = "in attesa"; 
 tagEl.className = "out-tag out-neutral"; 
 if(conseqEl){ conseqEl.textContent = ""; } 
 } 
 } else { 
 if(!intInRange(resV,1,30)){
   tagEl.textContent = "Risultato impossibile"; tagEl.className = "out-tag out-fail"; status = "invalid";
   if(conseqEl){ conseqEl.textContent = "Inserisci un risultato intero compreso fra 1 e 30."; }
   pg.data["prod_status"] = status; return;
 }
 var rv = Number(resV); 
 var successo = false; 
 if(rv >= 1){ 
 if(rv <= total){ 
 successo = true; 
 } 
 } 
 if(successo){ 
 tagEl.textContent = "Riuscita"; 
 tagEl.className = "out-tag out-ok"; 
 status = "success"; 
 if(conseqEl){ conseqEl.textContent = "Produzione riuscita: bonus di +" + bonusP + "% sulla Forza finale della Pozione."; } 
 } else { 
 tagEl.textContent = "Fallita"; 
 tagEl.className = "out-tag out-fail"; 
 status = "fail"; 
 if(conseqEl){ conseqEl.textContent = "Produzione fallita, irrimediabile: malus di -" + malusP + "% sulla Forza finale della Pozione."; } 
 } 
 } 
 } 
 pg.data["prod_status"] = status; 
 
 var accBox = document.getElementById("prod-accumulo-" + pg.id); 
 if(accBox){ 
 var tiersList = getTiersPresentList(); 
 var prepAcc = computePrepAccumulo(pg, tiersList); 
 var prodAcc = computeProdAccumulo(pg); 
 var totalForza = prepAcc.forza + prodAcc.forza; 
 var testo = "<b>Situazione accumulata dopo la Produzione</b><br>"; 
 testo = testo + "Modificatore di Forza totale finora: " + fmtPct(totalForza) + 
 " (Preparazione: " + fmtPct(prepAcc.forza) + " + Produzione: " + fmtPct(prodAcc.forza) + ")<br>"; 
 testo = testo + "Modificatore di Durata degli effetti/bonus-malus (dalla Preparazione): " + fmtPct(prepAcc.durata); 
 if(!prepAcc.complete){ 
 testo = testo + "<br><i>La Preparazione non è ancora completa: questo valore può cambiare.</i>"; 
 } 
 if(!prodAcc.complete){ 
 testo = testo + "<br><i>La Produzione non ha ancora un risultato: questo valore è provvisorio.</i>"; 
 } 
 accBox.innerHTML = testo; 
 } 
 }

 var formulaEl = document.getElementById("bac-formula-" + pg.id); 
 if(formulaEl){ 
 formulaEl.textContent = "Tecnica " + tecBase + " + Tocco Magico " + toccoB + " + Extra " + extraManual + " = " + total + " su 15";

 } 
 
 var tagEl = document.getElementById("bac-tag-" + pg.id); 
 var bacStatus = "pending"; 
 if(tagEl){

 if(resV === ""){

 tagEl.className = "out-tag out-ok"; 
 bacStatus = "success";

 tagEl.textContent = "in attesa"; 
 tagEl.className = "out-tag out-neutral";

   pg.data["bac_status"] = bacStatus; recomputeDosiFinaleDisplay(pg); return;
 }
 var rv = Number(resV); 
 var successo2 = false; 
 if(rv >= 1){ 
 if(rv <= total){ 
 successo2 = true; 
 } 
 } 
 if(successo2){ 
 tagEl.textContent = "Riuscita"; 
 tagEl.className = "out-tag out-ok"; 
 bacStatus = "success"; 
 } else { 
 tagEl.textContent = "Fallita (-1 dose)"; 
 tagEl.className = "out-tag out-fail"; 
 bacStatus = "fail"; 
 } 
 }

 pg.data["bac_status"] = bacStatus; 
 recomputeDosiFinaleDisplay(pg); 
 }

 function votoCalderaioFixed(pg){
 var map = { T:1, D:2, S:3, A:4, O:5, E:6 };
 if(pg.tipo === "studente"){
  // Per gli Studenti il voto resta la base. Calderaio I aggiunge +1 al valore X
  // usato per stabilire la fascia del successivo 1d10.
  return map[pg.voto] + levelNum(pg.calderaio);
 }
 var mapC = { I:7, II:8, III:9, IV:10, V:11 };
 if(levelNum(pg.calderaio) > 0){ return mapC[pg.calderaio]; }
 return null; // Adulto senza Calderaio: richiede 1d6
 } 
 
 function bracketFor(x){ 
 if(x >= 31){ return { z:"1", tt:"2", ss:"3-4", cc:"5-6-7-8-9-10" }; } 
 if(x >= 27){ return { z:"1", tt:"2", ss:"3-4-5", cc:"6-7-8-9-10" }; } 
 if(x >= 21){ return { z:"1-2", tt:"3-4", ss:"5-6-7", cc:"8-9-10" }; } 
 if(x >= 14){ return { z:"1-2-3", tt:"4-5-6", ss:"6-7", cc:"8-9-10" }; } 
 if(x >= 7){ return { z:"1-2-3", tt:"4-5-6", ss:"7-8", cc:"9-10" }; } 
 return { z:"1-2-3-4", tt:"5-6-7", ss:"8-9", cc:"10" }; 
 } 
 

function sintesiReductionInfo(pg){
 if(!extraIsUsed(pg,"sintesi")){ return { ready:true, percent:0, label:"Sintesi non usata" }; }
 var eff = normalizeExtraEfficacia(pg,"sintesi");
 if(eff === "pending"){ return { ready:false, percent:0, label:"Serve il 1d10 di Efficacia di Sintesi Tecnica+" }; }
 if(eff === "0"){ return { ready:true, percent:0, label:"Sintesi 0%: nessuna riduzione dei post (Fatica comunque spesa)" }; }
 var sapiente = pg.tipo === "adulto" && haSapienzaPozionistica(pg);
 if(sapiente){
   if(eff === "100"){ return { ready:true, percent:40, label:"Sintesi 100%: -40% post" }; }
   return { ready:false, percent:0, label:"Efficacia non prevista per Adulto con Sapienza Pozionistica 1+" };
 }
 if(pg.tipo === "studente") {
   if(eff === "100"){ return { ready:true, percent:20, label:"Sintesi 100%: -20% post" }; }
   if(eff === "33"){ return { ready:true, percent:10, label:"Sintesi 33%: -10% post" }; }
   if(eff === "66"){
     var d2s = pgDataGet(pg, "sintesi_d2", "");
     if(!intInRange(d2s,1,2)){ return { ready:false, percent:0, needsD2:true, label:"Sintesi 66%: serve 1d2 ×10%" }; }
     return { ready:true, percent:Number(d2s)*10, label:"Sintesi 66%: -" + (Number(d2s)*10) + "% post" };
   }
 } else {
   if(eff === "100"){ return { ready:true, percent:30, label:"Sintesi 100%: -30% post" }; }
   if(eff === "33"){ return { ready:true, percent:20, label:"Sintesi 33%: -20% post" }; }
   if(eff === "66"){
     var d2a = pgDataGet(pg, "sintesi_d2", "");
     if(!intInRange(d2a,1,2)){ return { ready:false, percent:0, needsD2:true, label:"Sintesi 66%: serve -10% -1d2×10%" }; }
     var pct = 10 + Number(d2a)*10;
     return { ready:true, percent:pct, label:"Sintesi 66%: -" + pct + "% post" };
   }
 }
 return { ready:false, percent:0, label:"Efficacia Sintesi non interpretabile" };
}

function applySintesiToPosts(pg, basePosts){
 var info = sintesiReductionInfo(pg);
 if(basePosts === null || basePosts === undefined){ return { ready:false, base:basePosts, exact:null, info:info }; }
 if(!info.ready){ return { ready:false, base:basePosts, exact:null, info:info }; }
 var exact = basePosts * (100 - info.percent) / 100;
 exact = Math.round(exact * 100) / 100;
 return { ready:true, base:basePosts, exact:exact, info:info, fractional:Math.floor(exact) !== exact };
}

 function imbottPostFinali(pg, esito){
 if(esito === "" || esito === "0%"){ return null; }

 var classIndexMap = { X:0, XX:1, XXX:2, XXXX:3, XXXXX:4 };
 var idx = classIndexMap[POZ.classificazione];
 if(idx === undefined){ idx = 0; }

 var base100;
 if(pg.tipo === "studente"){
   base100 = 28;
 } else if(levelNum(pg.calderaio) > 0){
   base100 = 4;
 } else {
   base100 = 16;
 }

 var esitoExtra = 0;
 if(esito === "66%"){ esitoExtra = 4; }
 if(esito === "33%"){ esitoExtra = 8; }

 return base100 + (idx * 4) + esitoExtra;
 }

 function recomputeImbott(pg){ 
 var votoC = votoCalderaioFixed(pg);
 var imbAuxReady = true; 
 if(votoC === null){ 
  var d6v = pgDataGet(pg, "imb_d6", "");
  if(intInRange(d6v,1,6)){ votoC = Number(d6v); } else { votoC = 0; imbAuxReady = false; }
 } 
 var x = votoC + pg.tecnica;
 var imbCopyBtn = document.getElementById("imb-copy-" + pg.id);
 var imbResultInp = document.getElementById("imb-result-" + pg.id);
 if(imbCopyBtn){ imbCopyBtn.disabled = !imbAuxReady; }
 if(imbResultInp){ imbResultInp.disabled = !imbAuxReady; } 
 
 var formulaEl = document.getElementById("imb-formula-" + pg.id); 
 if(formulaEl){ 
 if(pg.tipo === "studente"){
   var votoBaseMap = { T:1, D:2, S:3, A:4, O:5, E:6 };
   var votoBase = votoBaseMap[pg.voto];
   var caldBonus = levelNum(pg.calderaio);
   formulaEl.innerHTML = "Studente: <b>Voto</b> (" + votoBase + ")" + (caldBonus ? " + <b>Calderaio I</b> (+1)" : "") + " + <b>Tecnica</b> (" + pg.tecnica + ") = X <b>" + x + "</b>.";
  } else {

 function esitoFromBracket(br, rv){
 if(!isFinite(rv) || Math.floor(rv) !== rv || rv < 1){ return "INVALIDO"; }
 if(rv > 10){ return "100%"; }
 var rvStr = String(rv);
 function inRange(rangeStr){
  var parts = rangeStr.split("-");
  for(var i=0;i<parts.length;i++){ if(parts[i] === rvStr){ return true; } }
  return false;
 }
 var matches = [];
 if(inRange(br.z)){ matches.push("0%"); }
 if(inRange(br.tt)){ matches.push("33%"); }
 if(inRange(br.ss)){ matches.push("66%"); }
 if(inRange(br.cc)){ matches.push("100%"); }
 if(matches.length === 0){ return "INVALIDO"; }
 if(matches.length > 1){ return "AMBIGUO"; }
 return matches[0];
 }

 function distillSpaceFrom(pg, eff, roll){
 if(eff === "skip" || eff === "0"){ return "standard"; }
 var isStudente = (pg.tipo === "studente");
 var haSapienza = haSapienzaPozionistica(pg);
 if(isStudente){
   if(eff === "33"){ return "1/2"; }
   if(eff === "66"){ if(roll === 1){ return "1/2"; } if(roll === 2){ return "1/3"; } }
   if(eff === "100"){ if(roll === 1 || roll === 2){ return "1/2"; } if(roll === 3){ return "1/3"; } }
 } else if(haSapienza){
   if(eff === "33"){ return "1/4"; }
   if(eff === "100"){ return "1/5"; }
   if(eff === "66"){ if(roll === 1){ return "1/4"; } if(roll === 2){ return "1/5"; } }
 } else {
   if(eff === "33"){ return "1/3"; }
   if(eff === "66"){ if(roll === 1){ return "1/3"; } if(roll === 2){ return "1/4"; } }
   if(eff === "100"){ if(roll === 1 || roll === 2){ return "1/3"; } if(roll === 3){ return "1/4"; } }
 }
 return null;
 }

 function distillOutcomeSpec(pg, eff){
  if(eff === "0"){ return {fixed:"standard", faces:0, desc:"Distillazione fallita: la dose resta a spazio standard."}; }
  var stud = pg.tipo === "studente";
  var sap = haSapienzaPozionistica(pg);
  if(stud){
    if(eff === "33"){ return {fixed:"1/2", faces:0, desc:"Con Efficacia 33% la dose occupa 1/2 spazio."}; }
    if(eff === "66"){ return {fixed:null, faces:2, desc:"1: dose = 1/2 spazio, 2: dose = 1/3 spazio"}; }
    if(eff === "100"){ return {fixed:null, faces:3, desc:"1-2: dose = 1/2 spazio, 3: dose = 1/3 spazio"}; }
  } else if(sap){
    if(eff === "33"){ return {fixed:"1/4", faces:0, desc:"Con Efficacia 33% la dose occupa 1/4 spazio."}; }
    if(eff === "66"){ return {fixed:null, faces:2, desc:"1: dose = 1/4 spazio, 2: dose = 1/5 spazio"}; }
    if(eff === "100"){ return {fixed:"1/5", faces:0, desc:"Con Efficacia 100% la dose occupa 1/5 spazio."}; }
  } else {
    if(eff === "33"){ return {fixed:"1/3", faces:0, desc:"Con Efficacia 33% la dose occupa 1/3 spazio."}; }
    if(eff === "66"){ return {fixed:null, faces:2, desc:"1: dose = 1/3 spazio, 2: dose = 1/4 spazio"}; }
    if(eff === "100"){ return {fixed:null, faces:3, desc:"1-2: dose = 1/3 spazio, 3: dose = 1/4 spazio"}; }
  }
  return {fixed:null, faces:0, desc:"Esito non riconosciuto."};
 }

 function appendDistillRetryFlow(out, pg, firstEff, firstSpace){
  if(firstEff !== "0" && firstEff !== "33" && firstEff !== "66"){ return {space:firstSpace, attempts:1, destroyed:false}; }

  /* Il secondo tentativo può iniziare soltanto dopo aver risolto completamente il primo.
     Con Efficacia 66% il regolamento richiede prima il relativo 1d2 sullo spazio occupato. */
  if(firstEff === "66" && firstSpace === null){
    pg.data["distill_retry_risk"] = "";
    pg.data["distill_retry_eff"] = "none";
    pg.data["distill_retry_roll"] = "";
    out.appendChild(el("div", "divider"));
    out.appendChild(el("p", "small-note", "Completa prima il <b>1d2 del 1° tentativo al 66%</b>. Il controllo di rischio e l’eventuale 2° tentativo saranno disponibili solo dopo che il primo tentativo avrà un esito completo."));
    return {space:null, attempts:1, destroyed:false};
  }

  out.appendChild(el("div", "divider"));
  out.appendChild(el("p", "small-note", "Dopo un fallimento o un effetto ridotto puoi scegliere di tentare una seconda Distillazione sulla stessa dose. Prima del 2° tentativo tira 1d2: con 1 puoi procedere, con 2 la Pozione esplode. Un eventuale 3° tentativo farebbe esplodere automaticamente la Pozione, quindi il calcolatore non lo propone."));
  var risk = el("div", "result-line");
  var cid="distill-retry-risk-code-"+pg.id;
  var code=el("div","dice-code"); code.id=cid; code.textContent="[dice=1d2]Rischio prima del 2° tentativo di Distillazione - "+pg.nome+" (1 = puoi procedere; 2 = Pozione esplosa)[/dice]"; risk.appendChild(code);
  var cp=el("button","copy-btn","Copia"); cp.id="distill-retry-risk-copy-"+pg.id; risk.appendChild(cp);
  var rinp=el("input"); rinp.type="number"; rinp.min="1"; rinp.max="2"; rinp.step="1"; rinp.placeholder="facoltativo 1-2"; rinp.value=pgDataGet(pg,"distill_retry_risk",""); risk.appendChild(rinp);
  var rtag=el("span","out-tag out-neutral","non ritentata"); risk.appendChild(rtag); out.appendChild(risk);
  setTimeout(function(){attachCopy("distill-retry-risk-copy-"+pg.id,cid);},0);
  rinp.addEventListener("change",function(){ pg.data["distill_retry_risk"]=rinp.value; if(rinp.value!=="1"){ pg.data["distill_retry_eff"]="none"; pg.data["distill_retry_roll"]=""; } recomputeDistill(pg); });

  if(rinp.value === ""){ return {space:firstSpace, attempts:1, destroyed:false}; }
  if(!intInRange(rinp.value,1,2)){ rtag.textContent="Risultato impossibile"; rtag.className="out-tag out-fail"; return {space:firstSpace, attempts:1, destroyed:false}; }
  if(Number(rinp.value)===2){
    rtag.textContent="Pozione esplosa"; rtag.className="out-tag out-fail";
    out.appendChild(el("div","guide-text","<b>La Pozione è persa.</b> Il d2 di rischio ha dato 2 prima del secondo tentativo: non può essere registrata nel Riepilogo finale."));
    return {space:null, attempts:1, destroyed:true};
  }
  rtag.textContent="2° tentativo consentito"; rtag.className="out-tag out-ok";

  var erow=el("div"); erow.appendChild(el("label",null,"Efficacia ottenuta — 2° tentativo (facoltativo)"));
  var esel=el("select");
  var ops=[["none","— non effettuato —"],["0","0% (fallita)"],["33","33%"],["66","66%"],["100","100%"]];
  for(var i=0;i<ops.length;i++){var o=el("option",null,ops[i][1]);o.value=ops[i][0];esel.appendChild(o);}
  esel.value=pgDataGet(pg,"distill_retry_eff","none"); erow.appendChild(esel); out.appendChild(erow);
  esel.addEventListener("change",function(){pg.data["distill_retry_eff"]=esel.value;pg.data["distill_retry_roll"]="";recomputeDistill(pg);});
  if(esel.value === "none"){ return {space:firstSpace, attempts:1, destroyed:false}; }

  var secondSpace=renderDistillAttemptOutcome(out,pg,esel.value,"distill-retry","2° tentativo di Distillazione");
  out.appendChild(el("p","small-note","Dopo questo 2° tentativo non viene proposto un ulteriore tentativo: il regolamento stabilisce che ripetere la Distillazione più di due volte fa esplodere la Pozione."));
  return {space:secondSpace, attempts:2, destroyed:false};
 }

 function recomputeDistill(pg){ 
 var eff = pgDataGet(pg, "distill_eff", "skip"); 
 var out = document.getElementById("distill-out-" + pg.id); 
 if(!out){ return; } 
 out.innerHTML = "";
 pg.data["distill_destroyed"] = false;
 pg.data["distill_attempts"] = 0;
 pg.data["distill_space"] = "standard";

 if(eff === "skip"){ 
   out.appendChild(el("p", "small-note", "Nessuna Distillazione: la dose mantiene lo spazio standard."));
   updateFaticaBox(pg, "distill");
   return; 
 }

 pg.data["distill_attempts"] = 1;
 var firstSpace = renderDistillAttemptOutcome(out, pg, eff, "distill", "1° tentativo di Distillazione");
 if(firstSpace === null && eff !== "0"){
   pg.data["distill_space"] = null;
 } else {
   pg.data["distill_space"] = firstSpace;
 }

 var retry = appendDistillRetryFlow(out, pg, eff, firstSpace);
 pg.data["distill_attempts"] = retry.attempts;
 pg.data["distill_destroyed"] = retry.destroyed;
 if(retry.destroyed){ pg.data["distill_space"] = null; }
 else if(retry.attempts === 2){ pg.data["distill_space"] = retry.space; }
 else if(firstSpace !== null){ pg.data["distill_space"] = firstSpace; }

 updateFaticaBox(pg, "distill");
 } 

 function extraAuditText(pg, field, nome){
  if(!extraIsUsed(pg,field)){ return ""; }
  var eff = normalizeExtraEfficacia(pg,field);
  var costo = field === "sintesi" ? "2" : "1,5";
  if(eff === "pending"){ return nome + ": Efficacia non ancora determinata; Fatica -" + costo + "."; }
  if(eff === "0"){ return nome + ": Efficacia 0%, nessun effetto OFFGame; Fatica -" + costo + "."; }
  if(field === "manualita" || field === "memoria"){
    var obj = extraBonusStatic(pg,field,eff);
    var bonus = obj.fixed || 0;
    if(obj.diceFaces > 0){
      var key = field === "manualita" ? "prep_man_dice" : "prod_mem_dice";
      var dv = pgDataGet(pg,key,"");
      if(intInRange(dv,1,obj.diceFaces)){ bonus += Number(dv); }
      else { return nome + ": Efficacia " + eff + "%, dado dell'effetto non ancora risolto; Fatica -" + costo + "."; }
    }
    var destinazione = field === "manualita" ? "ai d14 di Preparazione" : "al d30 di Produzione";
    return nome + ": Efficacia " + eff + "%, +" + bonus + " possibilità " + destinazione + "; Fatica -" + costo + ".";
  }
  var sinfo = sintesiReductionInfo(pg);
