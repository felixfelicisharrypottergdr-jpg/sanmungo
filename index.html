<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Medimagia — San Mungo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
--parchment:#efe4c8;
--parchment-dark:#e2d3ab;
--panel:#fbf3dd;
--ink:#1e3b2f;
--ink-soft:#2c4d3d;
--sage:#5c7a63;
--gold:#a9812f;
--gold-light:#c9a24f;
--grave:#7a2e2e;
--grave-bg:#f3dcd6;
--lieve:#3f6b4a;
--lieve-bg:#dfe9d9;
--line:#c9b98a;
--shadow:0 2px 0 rgba(30,59,47,.08), 0 8px 20px rgba(30,59,47,.08);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
background:
radial-gradient(ellipse at top left, rgba(169,129,47,.10), transparent 55%),
radial-gradient(ellipse at bottom right, rgba(92,122,99,.12), transparent 55%),
var(--parchment);
color:var(--ink);
font-family:Georgia,'Iowan Old Style','Palatino Linotype',serif;
font-size:17px;
line-height:1.5;
}
.wrap{max-width:980px;margin:0 auto;padding:28px 18px 80px}
h1,h2,h3,h4{font-family:'Palatino Linotype','Book Antiqua',Georgia,serif; font-weight:700; color:var(--ink); margin:0 0 6px}
.brand{
display:flex; align-items:baseline; gap:14px; justify-content:center;
padding:10px 0 6px; text-align:center; flex-direction:column;
}
.brand h1{font-size:clamp(28px,5vw,42px); letter-spacing:.03em}
.brand p{margin:0; color:var(--sage); font-style:italic}
.seal-toggle{
display:flex; justify-content:center; gap:0; margin:22px 0 30px;
border:2px solid var(--ink); border-radius:999px; overflow:hidden;
background:var(--panel); box-shadow:var(--shadow); max-width:520px; margin-left:auto; margin-right:auto;
}
.seal-toggle button{
flex:1; border:none; background:transparent; cursor:pointer;
font-family:'Palatino Linotype','Book Antiqua',Georgia,serif; font-size:14px; letter-spacing:.06em; text-transform:uppercase;
padding:14px 10px; color:var(--ink-soft); transition:.15s;
}
.seal-toggle button.active{background:var(--ink); color:var(--parchment)}
.seal-toggle button:not(.active):hover{background:var(--parchment-dark)}
.panel{
background:var(--panel); border:1px solid var(--line); border-radius:14px;
padding:22px 24px; margin-bottom:20px; box-shadow:var(--shadow);
}
.panel > h2{
font-size:20px; border-bottom:2px solid var(--line); padding-bottom:10px; margin-bottom:16px;
display:flex; align-items:center; gap:10px;
}
.panel > h2 .tag{
font-family:'Courier New',monospace; font-size:11px; background:var(--ink); color:var(--parchment);
padding:3px 8px; border-radius:6px; letter-spacing:.05em;
}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:16px}
.grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px}
@media(max-width:720px){.grid2,.grid3{grid-template-columns:1fr}}
label{display:block; font-size:13px; color:var(--sage); font-weight:600; margin-bottom:4px; letter-spacing:.02em}
input[type=text],input[type=number],select{
width:100%; padding:9px 10px; border:1.5px solid var(--line); border-radius:8px;
background:#fff; font-family:Georgia,'Iowan Old Style',serif; font-size:16px; color:var(--ink);
}
input[type=checkbox]{transform:scale(1.15); margin-right:6px}
.field{margin-bottom:14px}
.btn{
font-family:'Palatino Linotype','Book Antiqua',Georgia,serif; font-size:13px; letter-spacing:.04em; text-transform:uppercase;
background:var(--ink); color:var(--parchment); border:none; border-radius:8px;
padding:11px 18px; cursor:pointer; transition:.15s;
}
.btn:hover{background:var(--ink-soft)}
.btn.gold{background:var(--gold); color:#2a1f04}
.btn.gold:hover{background:var(--gold-light)}
.btn.ghost{background:transparent; border:1.5px solid var(--ink); color:var(--ink)}
.btn.ghost:hover{background:var(--ink); color:var(--parchment)}
.btn.small{padding:6px 12px; font-size:11px}
.pill{
display:inline-flex; align-items:center; gap:6px; font-family:'Courier New',monospace;
font-size:12px; padding:4px 10px; border-radius:999px; border:1.5px solid var(--line); background:#fff;
}
.class-X{--cc:#3f6b4a}.class-XX{--cc:#7a8a2e}.class-XXX{--cc:#a9812f}.class-XXXX{--cc:#b9622e}.class-XXXXX{--cc:#7a2e2e}
.class-badge{
font-family:'Courier New',monospace; font-weight:700; font-size:12px;
color:#fff; background:var(--cc); padding:2px 7px; border-radius:5px; letter-spacing:.05em;
}
.sym-list{max-height:420px; overflow-y:auto; border:1px solid var(--line); border-radius:10px; background:#fff}
.sym-row{
display:flex; align-items:center; gap:10px; padding:8px 12px; border-bottom:1px solid var(--parchment-dark);
cursor:pointer; font-size:15px;
}
.sym-row:last-child{border-bottom:none}
.sym-row:hover{background:var(--parchment)}
.sym-row.checked{background:var(--lieve-bg)}
.sym-row .nm{flex:1}
.result-box{
border:1.5px dashed var(--gold); border-radius:10px; padding:16px 18px; background:#fffdf5; margin-top:14px;
}
.result-box.grave{border-color:var(--grave); background:var(--grave-bg)}
.result-box.ok{border-color:var(--lieve); background:var(--lieve-bg)}
.kv{display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px dotted var(--line); font-size:15px}
.kv:last-child{border-bottom:none}
.kv b{font-family:'Courier New',monospace}
table.tidy{width:100%; border-collapse:collapse; font-size:14px}
table.tidy th{
text-align:left; font-family:'Palatino Linotype','Book Antiqua',Georgia,serif; font-size:11px; letter-spacing:.05em; text-transform:uppercase;
color:var(--sage); padding:6px 8px; border-bottom:2px solid var(--line);
}
table.tidy td{padding:7px 8px; border-bottom:1px solid var(--parchment-dark); vertical-align:top}
.muted{color:var(--sage); font-size:14px}
.note{
background:var(--parchment-dark); border-left:4px solid var(--gold); padding:10px 14px; border-radius:0 8px 8px 0;
font-size:14px; margin:12px 0;
}
.hidden{display:none !important}
.tabs{display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap}
.tabs button{
font-family:'Palatino Linotype','Book Antiqua',Georgia,serif; font-size:12px; letter-spacing:.03em; text-transform:uppercase;
padding:9px 14px; border-radius:8px 8px 0 0; border:1.5px solid var(--line); border-bottom:none;
background:var(--parchment-dark); color:var(--ink-soft); cursor:pointer;
}
.tabs button.active{background:var(--panel); color:var(--ink); border-color:var(--ink)}
.subtab{display:none}
.subtab.active{display:block}
.queue-item{
display:flex; align-items:center; gap:10px; padding:8px 10px; background:#fff; border:1px solid var(--line);
border-radius:8px; margin-bottom:6px; font-size:14px;
}
.queue-item .x{margin-left:auto; cursor:pointer; color:var(--grave); font-weight:700; font-family:monospace}
.dice-roll{
font-family:'Courier New',monospace; font-size:28px; font-weight:700; color:var(--ink);
background:var(--parchment-dark); display:inline-block; padding:6px 16px; border-radius:8px; margin:6px 0;
}
.success{color:var(--lieve); font-weight:700}
.fail{color:var(--grave); font-weight:700}
.searchbar{margin-bottom:10px}
footer{text-align:center; color:var(--sage); font-size:13px; margin-top:40px; font-style:italic}
::-webkit-scrollbar{width:10px}
::-webkit-scrollbar-thumb{background:var(--line); border-radius:6px}

/* --- stepper --- */
.stepper{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:18px}
.step-btn{
font-family:'Palatino Linotype','Book Antiqua',Georgia,serif; font-size:12px; letter-spacing:.02em;
padding:8px 12px; border-radius:999px; border:1.5px solid var(--line); background:var(--parchment-dark);
color:var(--ink-soft); cursor:pointer;
}
.step-btn.active{background:var(--ink); color:var(--parchment); border-color:var(--ink)}
.step-btn.done{border-color:var(--lieve); color:var(--lieve)}
.step-intro{font-style:italic; color:var(--sage); margin:0 0 16px; font-size:16px}
.step-nav{display:flex; justify-content:space-between; margin-top:20px}
.step-body{display:none}
.step-body.active{display:block}

/* --- dice widget --- */
.dice-widget{
border:1.5px solid var(--ink); border-radius:10px; padding:12px 14px; margin:10px 0; background:#fffdf5;
}
.dice-tag{
font-family:'Courier New',monospace; font-size:13px; background:var(--parchment-dark); padding:8px 10px;
border-radius:6px; word-break:break-word; user-select:all; margin-bottom:8px;
}
.dice-actions{display:flex; align-items:center; gap:10px; margin-bottom:10px; flex-wrap:wrap}
.dice-input{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.dice-input input{width:90px}
.dice-out{margin-top:8px; font-size:14px}
.guaritore-card{
border:1.5px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:10px; background:#fff;
display:flex; align-items:center; gap:14px; flex-wrap:wrap;
}
.guaritore-card .nome{font-family:'Palatino Linotype','Book Antiqua',Georgia,serif; font-weight:700}
.guaritore-card .stat{font-family:'Courier New',monospace; font-size:12px; color:var(--sage)}
.guaritore-card .x{margin-left:auto; cursor:pointer; color:var(--grave); font-weight:700; font-family:monospace}
.prep-block{border:1.5px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:14px; background:#fbfaf3}
.prep-block > .prep-title{font-weight:700; color:var(--ink-soft); margin-bottom:10px; font-size:15px}
.seg{display:flex; gap:0; border:1.5px solid var(--ink); border-radius:8px; overflow:hidden; max-width:340px; margin-bottom:12px}
.seg label{flex:1; text-align:center; padding:8px 6px; cursor:pointer; font-size:13px; margin:0; background:#fff; color:var(--ink-soft)}
.seg label.on{background:var(--ink); color:var(--parchment)}
.seg input{display:none}
.prep-preview{font-size:13px; color:var(--sage); margin-top:8px; padding:8px 10px; background:var(--parchment-dark); border-radius:6px}
.step-warning{color:var(--grave); font-size:14px; font-weight:600; margin-top:12px; min-height:0}
.spiega-inline{font-style:italic; color:var(--sage); font-size:13px; line-height:1.4; display:block}

/* ==========================================================

/* Classificazioni: dalla salvia al rosso, coerenti con la gravità. */

}

}

}

</style>

}

<script>
/* Costruita per concatenazione per compatibilita con l'editor del forum */
const EVT_NAME = 'cli' + 'ck';
function onPress(el, fn){ el.addEventListener(EVT_NAME, fn); }
function esc(s){
const d = document.createElement('div');
d.textContent = s;
return d.innerHTML;
}
function copyText(txt, btn){
function fatto(){
const orig = btn.textContent;
btn.textContent = 'Copiato!';
setTimeout(function(){ btn.textContent = orig; }, 1400);
}
if(navigator.clipboard){
navigator.clipboard.writeText(txt).then(fatto, function(){ copiaFallback(txt); fatto(); });
} else {
copiaFallback(txt);
fatto();
}
}
function copiaFallback(txt){
const ta = document.createElement('textarea');
ta.value = txt;
ta.style.position = 'fixed';
ta.style.opacity = '0';
document.body.appendChild(ta);
ta.select();
try{ document.execCommand('copy'); } catch(e){}
document.body.removeChild(ta);
}
let widgetCounter = 0;

/* ==========================================================================
COMPONENTE DADO COPIABILE
opts: {faces, addends:[{label,value}], successLabel, onConfirm(risultato, esito, totale)}
Se totale > faces -> autoconclusivo positivo (nessun dado)
Se opts.forceFail -> autoconclusivo negativo, con opts.failText, nessun dado
========================================================================== */
function renderDiceCheck(container, opts){
widgetCounter += 1;
const uid = 'dw' + widgetCounter;

if(opts.forceFail){
container.innerHTML =
'<div class="result-box grave"><b>Esito automatico: fallimento.</b><br>' + esc(opts.failText) + '</div>';
if(opts.onConfirm){ opts.onConfirm(null, 'fail', null); }
return;
}

const totale = opts.addends.reduce(function(s,a){ return s + a.value; }, 0);
const formula = opts.addends.map(function(a){ return a.value + ' ' + a.label; }).join(' + ') + ' = ' + totale;

if(totale > opts.faces){
container.innerHTML =
'<div class="result-box ok"><b>Autoconclusivo: nessun dado necessario.</b><br>' +
esc(opts.successLabel + ' se 1-' + totale + ' (' + formula + ') — e sempre vero, si supera il massimo del dado.') + '</div>';
if(opts.onConfirm){ opts.onConfirm(null, 'auto', totale); }
return;
}

const label = opts.successLabel + ' se 1-' + totale + ' (' + formula + ')';
const tag = '[dice=1d' + opts.faces + ']' + label + '[/dice]';

container.innerHTML =
'<div class="dice-widget">' +

const out = document.getElementById(uid + '_out');

function mostraAnteprima(){
const r = parseInt(inputEl.value, 10);
if(isNaN(r) || r < 1 || r > opts.faces){
out.innerHTML = inputEl.value.length ? '<span class="fail">Il numero deve essere fra 1 e ' + opts.faces + '.</span>' : '';
if(opts.onLiveChange){ opts.onLiveChange(null, null, totale); }
return null;
}
const ok = r <= totale;
out.innerHTML = '<span class="' + (ok ? 'success' : 'fail') + '">Risultato ' + r + ' su 1-' + totale + ': ' +
(ok ? esc(opts.successLabel) : 'non riuscito') + '.</span>';
if(opts.onLiveChange){ opts.onLiveChange(r, ok ? 'ok' : 'fail', totale); }
return {r:r, ok:ok};
}

function conferma(){
const esito = mostraAnteprima();
if(!esito){ return; }
const isCorrection = committed;
committed = true;
if(opts.onConfirm){ opts.onConfirm(esito.r, esito.ok ? 'ok' : 'fail', totale, isCorrection); }
}

inputEl.addEventListener('input', function(){
mostraAnteprima();
});
inputEl.addEventListener('keydown', function(ev){
if(ev.key === 'Enter'){ conferma(); }
});
inputEl.addEventListener('blur', function(){ conferma(); });
}

/* ==========================================================================
STEPPER GENERICO
========================================================================== */
function buildStepper(root, containerId, steps, startAt){
let current = startAt || 0;
const html =
'<div class="stepper" id="' + containerId + '_nav"></div>' +
steps.map(function(s, i){
return '<div class="panel step-body' + (i===current?' active':'') + '" id="' + containerId + '_step' + i + '">' +
'<h2>' + esc(s.title) + '</h2>' +
'<p class="step-intro">' + esc(s.intro) + '</p>' +
'<div id="' + containerId + '_body' + i + '"></div>' +
'<div class="step-warning" id="' + containerId + '_warn' + i + '"></div>' +
'<div class="step-nav">' +
(i>0 ? '<button type="button" class="btn ghost" data-nav="' + containerId + '_prev' + i + '">Indietro</button>' : '<span></span>') +
(i<steps.length-1 ? '<button type="button" class="btn gold" data-nav="' + containerId + '_next' + i + '">Avanti</button>' : '<span></span>') +
'</div>' +
'</div>';
}).join('');
root.innerHTML = html;

function renderNav(){
const nav = document.getElementById(containerId + '_nav');
nav.innerHTML = steps.map(function(s, i){
let cls = 'step-btn';
if(i === current){ cls += ' active'; }
if(i < current){ cls += ' done'; }
return '<button type="button" class="' + cls + '" data-goto="' + i + '">' + (i+1) + '. ' + esc(s.short) + '</button>';
}).join('');
Array.prototype.forEach.call(nav.querySelectorAll('button'), function(b){
onPress(b, function(){ goTo(parseInt(b.getAttribute('data-goto'), 10)); });
});
}

function goTo(i){
for(let k=0;k<steps.length;k++){
document.getElementById(containerId + '_step' + k).classList.remove('active');
}
current = i;
document.getElementById(containerId + '_step' + i).classList.add('active');
renderNav();
if(steps[i].onShow){ steps[i].onShow(); }
try{
window.scrollTo({top:0, behavior:'smooth'});
} catch(e){
try{ window.scrollTo(0,0); } catch(e2){}
}
}

steps.forEach(function(s, i){
if(i>0){
const prevBtn = root.querySelector('[data-nav="' + containerId + '_prev' + i + '"]');
onPress(prevBtn, function(){ goTo(i-1); });
}
if(i<steps.length-1){
const nextBtn = root.querySelector('[data-nav="' + containerId + '_next' + i + '"]');
onPress(nextBtn, function(){
const warnEl = document.getElementById(containerId + '_warn' + i);
if(s.canLeave){
const esito = s.canLeave();
if(esito !== true){
if(warnEl){ warnEl.textContent = esito; }
return;
}
}
if(warnEl){ warnEl.textContent = ''; }
goTo(i+1);
});
}
});

renderNav();
if(steps[current].onShow){ steps[current].onShow(); }
return {
goTo: goTo,
bodyId: function(i){ return containerId + '_body' + i; },
refreshCurrent: function(){ if(steps[current].onShow){ steps[current].onShow(); } }
};
}

}

}
const trovati = PREZZIARIO.filter(function(p){ return p.nome.toLowerCase().indexOf(q) >= 0; }).slice(0, 25);

});

if(esistente){

} else {

cercaInput.value = '';
suggBox.style.display = 'none';

});

const listaBox = document.getElementById('auto-lista-acquisti');
if(!pazienteState.componentiAuto.length){
listaBox.innerHTML = '<p class="muted">Nessuna Componente ancora aggiunta alla lista acquisti.</p>';
} else {
listaBox.innerHTML = pazienteState.componentiAuto.map(function(c, i){
return '<div class="queue-item">' +
'<span class="pill">' + esc(c.tipo) + '</span>' +
'<span>' + esc(c.nome) + '</span>' +
'<input type="number" min="1" value="' + c.qta + '" data-i="' + i + '" class="auto-qta" style="width:60px">' +

'<span class="x" data-i="' + i + '">×</span>' +
'</div>';
}).join('');
Array.prototype.forEach.call(listaBox.querySelectorAll('.auto-qta'), function(inp){
inp.addEventListener('input', function(){
const i = parseInt(inp.getAttribute('data-i'), 10);
const v = parseInt(inp.value, 10);
pazienteState.componentiAuto[i].qta = (v > 0) ? v : 1;
selezionaNota();
});
});
Array.prototype.forEach.call(listaBox.querySelectorAll('.x'), function(x){
onPress(x, function(){
pazienteState.componentiAuto.splice(parseInt(x.getAttribute('data-i'), 10), 1);
selezionaNota();
});
});
}
}
}

Array.prototype.forEach.call(body.querySelectorAll('button[data-key]'), function(btn){
onPress(btn, function(){
pazienteState.metodo = btn.getAttribute('data-key');
renderStepMetodo();
});
});

selezionaNota();
}

function renderStepFinale(){
const body = document.getElementById('pz_body4');
const scelti = sintomiScelti();
const cMax = classeMax(scelti.map(function(s){ return s.c; }));
const grave = isGrave(cMax);
const t = TEMPI[cMax];
const metodo = pazienteState.metodo;
const idScelti = scelti.map(function(s){ return s.id; });
let extraPost = 0;
let complicazioniHtml = '';

if(metodo === 'offgame' || metodo === 'offgame_ant'){
complicazioniHtml = '<p class="muted">Guarigione OFFGame: nessuna Complicazione prevista.</p>';
} else {
const registrate = idScelti.filter(function(id){ return pazienteState.complicazioni[id]; }).map(function(id){ return pazienteState.complicazioni[id]; });
const falliti = registrate.filter(function(x){ return x.esito === 'fail'; });
if(registrate.length < idScelti.length){
const mancano = idScelti.length - registrate.length;
complicazioniHtml = '<p class="muted">Mancano ancora ' + mancano + ' Sintomi senza un esito registrato al passo precedente.</p>';
}
if(falliti.length){
const cPeggiore = classeMax(falliti.map(function(x){ return x.classe; }));
extraPost = TEMPI[cPeggiore].extra;
complicazioniHtml += '<div class="result-box grave"><b>Complicazioni sviluppate:</b><ul>' +
falliti.map(function(x){ return '<li>' + esc(x.testo) + '</li>'; }).join('') +
'</ul>Post extra aggiunti in base alla Complicazione piu grave: <b>' + extraPost + '</b></div>';
} else if(registrate.length){
complicazioniHtml += '<div class="result-box ok">Nessuna Complicazione sviluppata.</div>';
}
}

const postFinali = (pazienteState._postBase || t.post) + extraPost;
const costo = pazienteState._costo || 0;
const opzioniLabel = opzioniCura(scelti, cMax, grave, costoTotale(scelti));
const metodoScelto = opzioniLabel.find(function(o){ return o.key === metodo; });
const nomeMetodo = metodoScelto ? metodoScelto.nome : metodo;

let spesaHtml = '';
if(costo > 0){
spesaHtml =
'<div class="panel" style="background:#fff;margin-top:14px">' +
'<h4>Ricorda di segnalarlo nella Lista della Spesa</h4>' +

'<div class="dice-tag" id="spesa-riga"></div>' +
'<button type="button" class="btn small gold" id="spesa-copia">Copia la riga</button>' +
'</div>';
}

body.innerHTML =
complicazioniHtml +
'<div class="result-box" style="margin-top:14px">' +
'<div class="kv"><span>Post totali di Guarigione Passiva</span><b>' + postFinali + ' post</b></div>' +
'<div class="kv"><span>Degenza/Convalescenza ONGame</span><b>' + t.degenza + '</b></div>' +
'<div class="kv"><span>Guarigione OFFGame automatica dopo</span><b>' + t.offgameMesi + ' mesi</b></div>' +
'<div class="kv"><span>Costo delle cure</span><b>' + costo + ' Galeoni</b></div>' +
'</div>' +
spesaHtml;

if(costo > 0){
function aggiornaRigaSpesa(){
const role = document.getElementById('spesa-role').value.trim();
const roleTesto = role.length ? role : '[nome o link della role]';
document.getElementById('spesa-riga').textContent =
roleTesto + ' — ' + nomeMetodo + ' — ' + costo + ' Galeoni';
}
document.getElementById('spesa-role').addEventListener('input', aggiornaRigaSpesa);
onPress(document.getElementById('spesa-copia'), function(){
copyText(document.getElementById('spesa-riga').textContent, document.getElementById('spesa-copia'));
});
aggiornaRigaSpesa();
}
}

function wireTipoPG(prefissi){

Array.prototype.forEach.call(seg.querySelectorAll('label'), function(l){
const on = l.querySelector('input').checked;
if(on){ l.classList.add('on'); } else { l.classList.remove('on'); }
});
const tipo = seg.querySelector('input:checked').value;
prefissi.forEach(function(prefix){
const studenteDiv = document.getElementById(prefix + '-studente');
const adultoDiv = document.getElementById(prefix + '-adulto');
if(tipo === 'studente'){
studenteDiv.classList.remove('hidden');
adultoDiv.classList.add('hidden');

adultoDiv.classList.remove('hidden');
}
aggiornaPreviewSkill(prefix);
});
}
Array.prototype.forEach.call(seg.querySelectorAll('input'), function(r){
r.addEventListener('change', aggiornaTutto);
});
aggiornaTutto();
}

function wirePrepChirurgia(){
const haCa = document.getElementById('chi-ha-ca');
const caLivDiv = document.getElementById('chi-ca-liv');
const sap = document.getElementById('chi-sap');
haCa.addEventListener('change', function(){
if(haCa.checked){ caLivDiv.classList.remove('hidden'); } else { caLivDiv.classList.add('hidden'); }
aggiornaPreview();
});
sap.addEventListener('input', aggiornaPreview);
document.getElementById('chi-liv-ca').addEventListener('change', aggiornaPreview);
function aggiornaPreview(){
const r = readPrepChirurgia();
const out = document.getElementById('chi-preview');
if(r.base === null){
out.textContent = 'Con questi dati il Guaritore non puo tentare la Chirurgia (nessuna Sapienza Medimagica ne Conoscenza Avanzata da Chirurgo).';
} else {
out.textContent = 'Valore di base usato nei tiri: ' + r.base + ' — ' + r.label;
}
}
aggiornaPreview();
}

function readPrepBlock(prefix){
const tipo = document.querySelector('input[name="g-tipo"]:checked').value;
if(tipo === 'studente'){
const voto = document.getElementById(prefix + '-voto').value;
const o = VOTI.find(function(x){ return x.v === voto; });
return {base: o.base, label: 'Studente, voto ' + voto};
}
const haCa = document.getElementById(prefix + '-ha-ca').checked;
if(haCa){
const liv = parseInt(document.getElementById(prefix + '-liv-ca').value, 10);
return {base: 11 + liv, label: 'Adulto con Conoscenza Avanzata Livello ' + ROMANI[liv-1]};
}
return {base: 11, label: 'Adulto senza Conoscenza Avanzata'};
}

function readPrepChirurgia(){
const haCa = document.getElementById('chi-ha-ca').checked;
if(haCa){
const liv = parseInt(document.getElementById('chi-liv-ca').value, 10);
return {base: 6 + liv, label: 'Chirurgo Livello ' + ROMANI[liv-1]};
}
const sap = parseFloat(document.getElementById('chi-sap').value) || 0;
if(sap <= 0){ return {base: null, label: 'Nessuna Sapienza Medimagica ne Chirurgo'}; }
if(sap <= 5){ return {base: 4, label: 'Sapienza Medimagica 1-5, senza Chirurgo'}; }
if(sap <= 10){ return {base: 5, label: 'Sapienza Medimagica 6-10, senza Chirurgo'}; }
return {base: 6, label: 'Sapienza Medimagica 11 o piu, senza Chirurgo'};
}

function livelloDiagnostaPosseduto(g){
if(g.diagBase > 11){ return g.diagBase - 11; }
return 0;
}

function eseguiTentativoDiagnosi(g, c){
const dadi = document.getElementById('diag-dadi');
const selfEl = dadi.querySelector('.diag-self[data-classe="' + c + '"]');
const base = g.diagBase;
const addends = [
{label: 'Tecnica', value: g.tecnica},
{label: g.diagLabel, value: base},
{label: 'Classificazione ' + c, value: DIAGNOSI_BONUS[c]}
];
if(medimagoState.causaNota){
addends.push({label:'Causa gia nota', value: 3});
}
if(selfEl.checked){
const grezzo = addends.reduce(function(s,a){ return s + a.value; }, 0);
const ridotto = Math.floor(grezzo * 0.8);
addends.push({label:'Malus Auto-diagnosi -20%', value: ridotto - grezzo});
}
const out = document.getElementById('diag-out-' + c);
const ravvedimento = document.getElementById('diag-ravv-' + c);
if(ravvedimento){ ravvedimento.innerHTML = ''; }
let entryRef = null;
renderDiceCheck(out, {
faces: 40,
addends: addends,
successLabel: 'Riesce a riconoscere i Sintomi ' + c,
onConfirm: function(r, esito, totale, isCorrection){
if(!isCorrection){
const costo = g.sap25diag ? 0 : -2;
g.fatica += costo;
entryRef = {tipo:'Diagnosi', classe:c, esito:esito, fatica:costo};
g.esiti.push(entryRef);
} else {
entryRef.esito = esito;
}
renderStepRiepilogo();
const ravvBox = document.getElementById('diag-ravv-' + c);
if(esito === 'fail'){
mostraRavvedimento(g, c);
} else if(ravvBox){
ravvBox.innerHTML = '';
}
}
});
}

function mostraRavvedimento(g, c){
const dadi = document.getElementById('diag-dadi');
let ravv = document.getElementById('diag-ravv-' + c);
if(!ravv){
const blocco = dadi.querySelector('.diag-calcola[data-classe="' + c + '"]').closest('.panel');
const div = document.createElement('div');
div.id = 'diag-ravv-' + c;
div.style.marginTop = '10px';
blocco.appendChild(div);
ravv = div;
}
if(ravv.innerHTML){ return; }
const livello = livelloDiagnostaPosseduto(g);
ravv.innerHTML =
'<div class="note">Il Guaritore puo accorgersi di non aver individuato tutti i Sintomi e ritentare, una volta per post della stessa role di cura.</div>' +
'<div id="diag-ravv-dado-' + c + '"></div>';
renderDiceCheck(document.getElementById('diag-ravv-dado-' + c), {
faces: 30,
addends: [
{label:'Tecnica', value: g.tecnica},
{label:'Livello di Diagnosta posseduto', value: livello}
],
successLabel: 'Il Guaritore si accorge dell\'errore e puo ritentare',
onConfirm: function(r, esitoRavv){
const zonaRitenta = document.getElementById('diag-ravv-dado-' + c);
const vecchioExtra = zonaRitenta.querySelector('.ravv-extra');
if(vecchioExtra){ vecchioExtra.remove(); }
const extra = document.createElement('div');
extra.className = 'ravv-extra';
if(esitoRavv === 'fail'){
extra.innerHTML = '<p class="muted">Non se ne accorge questo post: puo riprovare al post successivo della stessa role di cura.</p>';
} else {
const btnRitenta = document.createElement('button');
btnRitenta.type = 'button';
btnRitenta.className = 'btn small gold';
btnRitenta.style.marginTop = '8px';
btnRitenta.textContent = 'Ritenta la Diagnosi per ' + c;
onPress(btnRitenta, function(){ eseguiTentativoDiagnosi(g, c); });
extra.appendChild(btnRitenta);
}
zonaRitenta.appendChild(extra);
}
});
}

let curaItemCounter = 0;

function calcolaDadoCura(sid, guaritoreId, pozione, selfcure){
const s = SINTOMI_BY_ID[sid];
const grave = isGrave(s.c);
const g = medimagoState.guaritori.find(function(x){ return x.id === guaritoreId; });
const potBonus = pozione === 'oop' ? 1 : (pozione === 'ecc' ? 2 : 0);
if(grave){
const base = g.chiBase;
if(base === null){
return {s:s, g:g, grave:grave, forceFail:true,
failText: g.nome + ' non possiede Sapienza Medimagica ne Conoscenza Avanzata da Chirurgo: non puo tentare la Chirurgia su questo Sintomo.'};
}
const addends = [
{label:'Tecnica', value: g.tecnica},
{label: g.chiLabel, value: base},
{label:'Classificazione ' + s.c, value: CHIRURGIA_BONUS[s.c]}
];
if(potBonus){ addends.push({label: pozione==='oop' ? 'Pozione Oltre Ogni Previsione' : 'Pozione Eccezionale', value: potBonus}); }
if(selfcure){
const grezzo = addends.reduce(function(s2,a){ return s2 + a.value; }, 0);
const ridotto = Math.floor(grezzo * 0.6);
addends.push({label:'Malus Auto-cura -40%', value: ridotto - grezzo});
}
return {s:s, g:g, grave:grave, faces:35, addends:addends, successLabel:'Cura con successo ' + s.n};
}
const base = g.terBase;
const addends = [
{label:'Tecnica', value: g.tecnica},
{label: g.terLabel, value: base},
{label:'Classificazione ' + s.c, value: TERAPIA_BONUS[s.c]}
];
if(potBonus){ addends.push({label: pozione==='oop' ? 'Pozione Oltre Ogni Previsione' : 'Pozione Eccezionale', value: potBonus}); }
if(selfcure){
const grezzo = addends.reduce(function(s2,a){ return s2 + a.value; }, 0);
const ridotto = Math.floor(grezzo * 0.7);
addends.push({label:'Malus Auto-cura -30%', value: ridotto - grezzo});
}
return {s:s, g:g, grave:grave, faces:40, addends:addends, successLabel:'Cura con successo ' + s.n};
}

document.getElementById('cura-sel').addEventListener('change', aggiornaAnteprima);
document.getElementById('cura-guaritore').addEventListener('change', aggiornaAnteprima);
document.getElementById('cura-pozione').addEventListener('change', aggiornaAnteprima);
document.getElementById('cura-selfcure').addEventListener('change', aggiornaAnteprima);

function creaEAggiungi(sid, guaritoreId, pozione, selfcure, risultatoPrecompilato){
const s = SINTOMI_BY_ID[sid];
const grave = isGrave(s.c);
const g = medimagoState.guaritori.find(function(x){ return x.id === guaritoreId; });
const costo = grave ? (g.sap25chi ? 0 : -1) : (g.sap25ter ? 0 : -0.5);
g.fatica += costo;
const entry = {tipo: grave ? 'Chirurgia' : 'Terapia', sintomo: s.n, sid: sid, esito: null, fatica: costo};
g.esiti.push(entry);

curaItemCounter += 1;
const item = {
uid: 'ci' + curaItemCounter,
sid: sid,
guaritoreId: guaritoreId,
pozione: pozione,
selfcure: selfcure,
esito: null,
entryRef: entry
};
medimagoState.coda.push(item);
renderStepRiepilogo();

const vuota = document.getElementById('cura-coda-vuota');
if(vuota){ vuota.remove(); }
aggiungiCardCura(item, risultatoPrecompilato);
}

onPress(document.getElementById('cura-add'), function(){
const anteprimaInput = document.querySelector('#cura-anteprima-dado input[type=number]');
let risultatoPrecompilato = null;
if(anteprimaInput){
if(anteprimaInput.value.length){ risultatoPrecompilato = anteprimaInput.value; }
}
creaEAggiungi(
document.getElementById('cura-sel').value,
document.getElementById('cura-guaritore').value,
document.getElementById('cura-pozione').value,
document.getElementById('cura-selfcure').checked,
risultatoPrecompilato
);
document.getElementById('cura-pozione').value = 'no';
document.getElementById('cura-selfcure').checked = false;
aggiornaAnteprima();
});

const bulkBtn = document.getElementById('cura-bulk');
if(bulkBtn){
onPress(bulkBtn, function(){
const guaritoreId = document.getElementById('cura-guaritore').value;
opzioniIndividuati.forEach(function(sid){
creaEAggiungi(sid, guaritoreId, 'no', false, null);
});
});
}
}

function aggiungiCardCura(item, risultatoPrecompilato){
const wrap = document.getElementById('cura-coda');
const info = calcolaDadoCura(item.sid, item.guaritoreId, item.pozione, item.selfcure);
const s = info.s;
const g = info.g;

const card = document.createElement('div');
card.className = 'panel';
card.style.background = '#fff';
card.id = 'cura-card-' + item.uid;
card.innerHTML =
'<div class="queue-item" style="border:none;padding:0;margin:0">' +
'<span class="class-badge class-' + s.c + '">' + s.c + '</span>' +
'<span>' + esc(s.n) + '</span>' +
'<span class="muted">' + (info.grave ? 'Chirurgia' : 'Terapia') + '</span>' +
'<span class="pill">' + esc(g.nome) + '</span>' +
'<span class="x" data-uid="' + item.uid + '">×</span>' +
'</div>' +
'<div id="cura-warn-' + item.uid + '" style="margin-top:8px"></div>' +
'<div id="cura-dice-' + item.uid + '" style="margin-top:8px"></div>' +
'<div id="cura-comp-' + item.uid + '"></div>';
wrap.appendChild(card);

onPress(card.querySelector('.x'), function(){
g.fatica -= item.entryRef.fatica;
const idx = g.esiti.indexOf(item.entryRef);
if(idx >= 0){ g.esiti.splice(idx, 1); }
const posizione = medimagoState.coda.indexOf(item);
if(posizione >= 0){ medimagoState.coda.splice(posizione, 1); }
card.remove();
renderStepRiepilogo();
if(!medimagoState.coda.length){
wrap.innerHTML = '<p class="muted" id="cura-coda-vuota">Nessun Sintomo aggiunto ancora.</p>';
}
});

const giaFallitoPrima = medimagoState.coda.some(function(x){
if(x === item){ return false; }
if(x.sid !== item.sid){ return false; }
if(x.esito !== 'fail'){ return false; }
return true;
});
if(giaFallitoPrima){
document.getElementById('cura-warn-' + item.uid).innerHTML =
'<p class="note">Attenzione: questo Sintomo ha gia una Complicazione in corso da un tentativo precedente. Il regolamento prevede che non se ne applichi una seconda uguale finche la prima non e esaurita (verifica i post di durata indicati nella Complicazione).</p>';
}

const diceTarget = document.getElementById('cura-dice-' + item.uid);

function mostraComplicazione(esito){
const box = document.getElementById('cura-comp-' + item.uid);
if(!box){ return; }
if(esito === 'fail'){
box.innerHTML = '<div class="result-box grave" style="margin-top:10px"><b>Complicazione:</b> ' + esc(s.x) + '</div>';
} else {
box.innerHTML = '';
}
}

if(info.forceFail){
renderDiceCheck(diceTarget, {
forceFail: true,
failText: info.failText,
onConfirm: function(){
item.esito = 'fail';
item.entryRef.esito = 'fail';
renderStepRiepilogo();
mostraComplicazione('fail');
}
});
return;
}

renderDiceCheck(diceTarget, {
faces: info.faces,
addends: info.addends,
successLabel: info.successLabel,
onLiveChange: function(r, esito){ mostraComplicazione(esito); },
onConfirm: function(r, esito){
item.esito = esito;
item.entryRef.esito = esito;
renderStepRiepilogo();
mostraComplicazione(esito);
}
});

if(risultatoPrecompilato){
const inputEl = diceTarget.querySelector('input[type=number]');
if(inputEl){
inputEl.value = risultatoPrecompilato;
inputEl.dispatchEvent(new Event('input', {bubbles:true}));
inputEl.dispatchEvent(new Event('blur', {bubbles:true}));
}
}
}

function renderStepRiepilogo(){
const body = document.getElementById('md_body3');
if(!body){ return; }
if(!medimagoState.guaritori.length){
body.innerHTML = '<p class="muted">Nessun Guaritore ancora aggiunto.</p>';
return;
}
let html = '';
medimagoState.guaritori.forEach(function(g){
const conFatica = g.esiti.filter(function(e){ return typeof e.fatica === 'number'; });
let dettaglioFatica = '';
if(conFatica.length){
dettaglioFatica = conFatica.map(function(e){
return e.fatica + ' ' + e.tipo + ' ' + (e.sintomo || e.classe);
}).join(', ') + ' = ' + g.fatica;
} else {
dettaglioFatica = '0';
}
html += '<div class="panel" style="background:#fff">' +
'<h4>' + esc(g.nome) + '</h4>' +
'<div class="kv"><span>Fatica spesa</span><b>' + g.fatica + '</b></div>' +
'<p class="muted" style="font-size:13px">' + esc(dettaglioFatica) + '</p>';
if(g.esiti.length){
html += '<table class="tidy" style="margin-top:8px"><thead><tr><th>Fase</th><th>Bersaglio</th><th>Esito</th></tr></thead><tbody>';
g.esiti.forEach(function(e){
const bers = e.sintomo || e.classe;
let cls, txt;
if(e.esito === null){
cls = 'muted';
txt = 'In attesa del risultato';
} else if(e.tipo === 'Complicazione'){
cls = e.esito === 'fail' ? 'fail' : 'success';
txt = e.esito === 'fail' ? 'Complicazione comparsa' : 'Nessuna Complicazione';
} else {
cls = e.esito === 'fail' ? 'fail' : 'success';
txt = e.esito === 'fail' ? 'Non riuscito' : (e.esito === 'auto' ? 'Autoconclusivo' : 'Riuscito');
}
let extraComplicazione = '';
if(e.esito === 'fail'){
if(e.tipo === 'Terapia' || e.tipo === 'Chirurgia'){
if(e.sid){
const sint = SINTOMI_BY_ID[e.sid];
if(sint){
extraComplicazione = '<br><span class="fail" style="font-weight:400;font-size:13px">Complicazione per il Paziente: ' + esc(sint.x) + '</span>';
}
}
}
}
html += '<tr><td>' + esc(e.tipo) + '</td><td>' + esc(bers) + '</td><td class="' + cls + '">' + txt + extraComplicazione + '</td></tr>';
});
html += '</tbody></table>';
} else {
html += '<p class="muted">Nessuna azione ancora registrata.</p>';
}
html += '</div>';
});
body.innerHTML = html;
}

/* ==========================================================================
AVVIO
========================================================================== */
buildPazienteWizard();
buildMedimagoWizard();
</script>

<script id="sanmungo-autoheight" type="text/javascript">
(function(){
  "use strict";

  var lastHeight = 0;
  var timer = null;

  function misuraAltezzaReale(){
    var wrap = document.querySelector(".wrap");

    if(wrap){
      var rect = wrap.getBoundingClientRect();
      return Math.ceil(rect.bottom + window.pageYOffset + 8);
    }

    return Math.ceil(document.body.getBoundingClientRect().bottom + window.pageYOffset + 8);
  }

  function inviaAltezza(){
    var altezza = misuraAltezzaReale();

    if(!altezza || altezza < 100){
      return;
    }

    if(Math.abs(altezza - lastHeight) < 2){
      return;
    }

    lastHeight = altezza;

    window.parent.postMessage({
      tipo: "altezzaSanMungo",
      altezza: altezza
    }, "*");
  }

  function programmaInvio(){
    if(timer){
      clearTimeout(timer);
    }

    timer = setTimeout(function(){
      inviaAltezza();

      setTimeout(inviaAltezza, 80);
      setTimeout(inviaAltezza, 250);
    }, 20);
  }

  window.addEventListener("load", programmaInvio);
  window.addEventListener("resize", programmaInvio);

  document.addEventListener("click", programmaInvio, true);
  document.addEventListener("change", programmaInvio, true);
  document.addEventListener("input", programmaInvio, true);

  if(window.ResizeObserver){
    var ro = new ResizeObserver(function(){
      programmaInvio();
    });

    var wrap = document.querySelector(".wrap");
    if(wrap){
      ro.observe(wrap);
    }
  }

  if(window.MutationObserver){
    var mo = new MutationObserver(function(){
      programmaInvio();
    });

    mo.observe(document.body, {
      childList:true,
      subtree:true,
      attributes:true,
      characterData:false
    });
  }

  setTimeout(programmaInvio, 100);
  setTimeout(programmaInvio, 500);
  setTimeout(programmaInvio, 1200);
})();
</script>
