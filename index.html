<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Medimagia — San Mungo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
@import url('https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css');

@font-face{
font-family:'magic';
src:url('https://dl.dropboxusercontent.com/scl/fi/nbzmrri4qyvc3tzx96911/HarryBeastDisplay-Regular.woff2?rlkey=he290voe32k33gowug23c1osc&st=nj9fgly1') format('woff2');
font-style:normal;
font-weight:400;
font-display:swap;
}

:root{
--parchment:#efe4c8;
--parchment-dark:#e2d3ab;
--panel:#fbf3dd;
--ink:#1e3b2f;
--ink-soft:#2c4d3d;
--sage:#5c7a63;
--gold:#a9812f;
--gold-light:#c9a24f;
--grave:#7a2e2e;
--grave-bg:#f3dcd6;
--lieve:#3f6b4a;
--lieve-bg:#dfe9d9;
--line:#c9b98a;
--shadow:0 2px 0 rgba(30,59,47,.08), 0 8px 20px rgba(30,59,47,.08);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
background:
radial-gradient(ellipse at top left, rgba(169,129,47,.10), transparent 55%),
radial-gradient(ellipse at bottom right, rgba(92,122,99,.12), transparent 55%),
var(--parchment);
color:var(--ink);
font-family:Georgia,'Iowan Old Style','Palatino Linotype',serif;
font-size:17px;
line-height:1.5;
}
.wrap{max-width:980px;margin:0 auto;padding:28px 18px 12px}
h1,h2,h3,h4{font-family:'magic','Palatino Linotype','Book Antiqua',Georgia,serif; font-weight:700; color:var(--ink); margin:0 0 6px}
.brand{
display:flex; align-items:baseline; gap:14px; justify-content:center;
padding:10px 0 6px; text-align:center; flex-direction:column;
}
.brand h1{font-size:clamp(28px,5vw,42px); letter-spacing:.03em}
.brand p{margin:0; color:var(--sage); font-style:italic}
.med-seal{
width:64px; height:64px; margin:0 auto 15px; display:flex; align-items:center; justify-content:center;
border:3px solid #355742; border-radius:50%;
background:radial-gradient(circle,rgba(177,96,108,.92),rgba(127,44,56,.95) 62%,rgba(92,23,33,.98));
color:#d4e7d2; font-size:29px; line-height:1;
box-shadow:0 0 0 4px rgba(53,87,66,.08),0 8px 20px rgba(68,24,30,.12),inset 0 0 16px rgba(250,236,238,.28);
}
.med-seal i{color:#d4e7d2;}
.seal-toggle{
display:flex; justify-content:center; gap:0; margin:22px 0 30px;
border:2px solid var(--ink); border-radius:999px; overflow:hidden;
background:var(--panel); box-shadow:var(--shadow); max-width:520px; margin-left:auto; margin-right:auto;
}
.seal-toggle button{
flex:1; border:none; background:transparent; cursor:pointer;
font-family:'magic','Palatino Linotype','Book Antiqua',Georgia,serif; font-size:14px; letter-spacing:.06em; text-transform:uppercase;
padding:14px 10px; color:var(--ink-soft); transition:.15s;
}
.seal-toggle button.active{background:var(--ink); color:var(--parchment)}
.seal-toggle button:not(.active):hover{background:var(--parchment-dark)}
.panel{
background:var(--panel); border:1px solid var(--line); border-radius:14px;
padding:22px 24px; margin-bottom:20px; box-shadow:var(--shadow);
}
.panel > h2{
font-size:20px; border-bottom:2px solid var(--line); padding-bottom:10px; margin-bottom:16px;
display:flex; align-items:center; gap:10px;
}
.panel > h2 .tag{
font-family:'Courier New',monospace; font-size:11px; background:var(--ink); color:var(--parchment);
padding:3px 8px; border-radius:6px; letter-spacing:.05em;
}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:16px}
.grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px}
@media(max-width:720px){.grid2,.grid3{grid-template-columns:1fr}}
label{display:block; font-size:13px; color:var(--sage); font-weight:600; margin-bottom:4px; letter-spacing:.02em}
input[type=text],input[type=number],select{
width:100%; padding:9px 10px; border:1.5px solid var(--line); border-radius:8px;
background:#fff; font-family:Georgia,'Iowan Old Style',serif; font-size:16px; color:var(--ink);
}
input[type=checkbox]{transform:scale(1.15); margin-right:6px}
.field{margin-bottom:14px}
.btn{
font-family:'Palatino Linotype','Book Antiqua',Georgia,serif; font-size:13px; letter-spacing:.04em; text-transform:uppercase;
background:var(--ink); color:var(--parchment); border:none; border-radius:8px;
padding:11px 18px; cursor:pointer; transition:.15s;
}
.btn:hover{background:var(--ink-soft)}
.btn.gold{background:var(--gold); color:#2a1f04}
.btn.gold:hover{background:var(--gold-light)}
.btn.ghost{background:transparent; border:1.5px solid var(--ink); color:var(--ink)}
.btn.ghost:hover{background:var(--ink); color:var(--parchment)}
.btn.small{padding:6px 12px; font-size:11px}
.pill{
display:inline-flex; align-items:center; gap:6px; font-family:'Courier New',monospace;
font-size:12px; padding:4px 10px; border-radius:999px; border:1.5px solid var(--line); background:#fff;
}
.class-X{--cc:#3f6b4a}.class-XX{--cc:#7a8a2e}.class-XXX{--cc:#a9812f}.class-XXXX{--cc:#b9622e}.class-XXXXX{--cc:#7a2e2e}
.class-badge{
font-family:'Courier New',monospace; font-weight:700; font-size:12px;
color:#fff; background:var(--cc); padding:2px 7px; border-radius:5px; letter-spacing:.05em;
}
.sym-list{max-height:420px; overflow-y:auto; border:1px solid var(--line); border-radius:10px; background:#fff}
.sym-row{
display:flex; align-items:center; gap:10px; padding:8px 12px; border-bottom:1px solid var(--parchment-dark);
cursor:pointer; font-size:15px;
}
.sym-row:last-child{border-bottom:none}
.sym-row:hover{background:var(--parchment)}
.sym-row.checked{background:var(--lieve-bg)}
.sym-row .nm{flex:1}
.result-box{
border:1.5px dashed var(--gold); border-radius:10px; padding:16px 18px; background:#fffdf5; margin-top:14px;
}
.result-box.grave{border-color:var(--grave); background:var(--grave-bg)}
.result-box.ok{border-color:var(--lieve); background:var(--lieve-bg)}
.kv{display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px dotted var(--line); font-size:15px}
.kv:last-child{border-bottom:none}
.kv b{font-family:'Courier New',monospace}
table.tidy{width:100%; border-collapse:collapse; font-size:14px}
table.tidy th{
text-align:left; font-family:'Palatino Linotype','Book Antiqua',Georgia,serif; font-size:11px; letter-spacing:.05em; text-transform:uppercase;
color:var(--sage); padding:6px 8px; border-bottom:2px solid var(--line);
}
table.tidy td{padding:7px 8px; border-bottom:1px solid var(--parchment-dark); vertical-align:top}
.muted{color:var(--sage); font-size:14px}
.note{
background:var(--parchment-dark); border-left:4px solid var(--gold); padding:10px 14px; border-radius:0 8px 8px 0;
font-size:14px; margin:12px 0;
}
/* v32 — importazione OFFGame dal tool Riuscita/Forza */
.ff-import-banner{border:1px solid var(--gold);border-left:5px solid var(--gold);border-radius:10px;padding:12px 14px;margin:0 0 16px;background:#fffdf5;font-size:14px;line-height:1.48;}
.ff-import-banner strong{color:var(--ink);}
.ff-import-banner .ff-import-title{font-family:'Palatino Linotype','Book Antiqua',Georgia,serif;font-weight:700;margin-bottom:5px;}
.ff-import-banner .ff-import-meta{color:var(--sage);font-size:13px;margin-top:5px;}
.ff-import-banner .ff-import-warning{margin-top:8px;font-weight:700;color:#7a2e2e;}
.ff-import-badge{margin-left:auto;display:inline-flex;align-items:center;padding:2px 6px;border-radius:999px;background:var(--parchment-dark);border:1px solid var(--gold);font-family:'Courier New',monospace;font-size:10px;color:var(--ink-soft);white-space:nowrap;}
.hidden{display:none !important}
.tabs{display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap}
.tabs button{
font-family:'Palatino Linotype','Book Antiqua',Georgia,serif; font-size:12px; letter-spacing:.03em; text-transform:uppercase;
padding:9px 14px; border-radius:8px 8px 0 0; border:1.5px solid var(--line); border-bottom:none;
background:var(--parchment-dark); color:var(--ink-soft); cursor:pointer;
}
.tabs button.active{background:var(--panel); color:var(--ink); border-color:var(--ink)}
.subtab{display:none}
.subtab.active{display:block}
.queue-item{
display:flex; align-items:center; gap:10px; padding:8px 10px; background:#fff; border:1px solid var(--line);
border-radius:8px; margin-bottom:6px; font-size:14px;
}
.queue-item .x{margin-left:auto; cursor:pointer; color:var(--grave); font-weight:700; font-family:monospace}
.dice-roll{
font-family:'Courier New',monospace; font-size:28px; font-weight:700; color:var(--ink);
background:var(--parchment-dark); display:inline-block; padding:6px 16px; border-radius:8px; margin:6px 0;
}
.success{color:var(--lieve); font-weight:700}
.fail{color:var(--grave); font-weight:700}
.searchbar{margin-bottom:10px}
footer{text-align:center; color:var(--sage); font-size:13px; margin-top:40px; font-style:italic}
::-webkit-scrollbar{width:10px}
::-webkit-scrollbar-thumb{background:var(--line); border-radius:6px}

/* --- stepper --- */
.stepper{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:18px}
.step-btn{
font-family:'magic','Palatino Linotype','Book Antiqua',Georgia,serif; font-size:12px; letter-spacing:.02em;
padding:8px 12px; border-radius:999px; border:1.5px solid var(--line); background:var(--parchment-dark);
color:var(--ink-soft); cursor:pointer;
}
.step-btn.active{background:var(--ink); color:var(--parchment); border-color:var(--ink)}
.step-btn.done{border-color:var(--lieve); color:var(--lieve)}
.step-intro{font-style:italic; color:var(--sage); margin:0 0 16px; font-size:16px}
.step-nav{display:flex; justify-content:space-between; margin-top:20px}
.step-body{display:none}
.step-body.active{display:block}

/* --- dice widget --- */
.dice-widget{
border:1.5px solid var(--ink); border-radius:10px; padding:12px 14px; margin:10px 0; background:#fffdf5;
}
.dice-tag{
font-family:'Courier New',monospace; font-size:13px; background:var(--parchment-dark); padding:8px 10px;
border-radius:6px; word-break:break-word; user-select:all; margin-bottom:8px;
}
.dice-actions{display:flex; align-items:center; gap:10px; margin-bottom:10px; flex-wrap:wrap}
.dice-input{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.dice-input input{width:90px}
.dice-out{margin-top:8px; font-size:14px}
.guaritore-card{
border:1.5px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:10px; background:#fff;
display:flex; align-items:center; gap:14px; flex-wrap:wrap;
}
.guaritore-card .nome{font-family:'Palatino Linotype','Book Antiqua',Georgia,serif; font-weight:700}
.guaritore-card .stat{font-family:'Courier New',monospace; font-size:12px; color:var(--sage)}
.guaritore-card .x{margin-left:auto; cursor:pointer; color:var(--grave); font-weight:700; font-family:monospace}
.prep-block{border:1.5px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:14px; background:#fbfaf3}
.prep-block > .prep-title{font-family:'magic','Palatino Linotype','Book Antiqua',Georgia,serif; font-weight:700; color:var(--ink-soft); margin-bottom:10px; font-size:15px}
.seg{display:flex; gap:0; border:1.5px solid var(--ink); border-radius:8px; overflow:hidden; max-width:340px; margin-bottom:12px}
.seg label{flex:1; text-align:center; padding:8px 6px; cursor:pointer; font-size:13px; margin:0; background:#fff; color:var(--ink-soft)}
.seg label.on{background:var(--ink); color:var(--parchment)}
.seg input{display:none}
.prep-preview{font-size:13px; color:var(--sage); margin-top:8px; padding:8px 10px; background:var(--parchment-dark); border-radius:6px}
.step-warning{color:var(--grave); font-size:14px; font-weight:600; margin-top:12px; min-height:0}
.spiega-inline{font-style:italic; color:var(--sage); font-size:13px; line-height:1.4; display:block}

/* ==========================================================
   PALETTE SAN MUNGO — VERDE CHIARO + ROSSO
   Solo intervento grafico: logica e contenuti invariati.
   ========================================================== */
:root{
  --parchment:#dcebdd;
  --parchment-dark:#c8ddcb;

  --gold-light:#b85a62;

  --grave-bg:#f2dadd;

  --lieve:#4f795d;
  --lieve-bg:#d6e8d8;

  --line:#a9c8ae;
  --shadow:0 2px 0 rgba(36,71,55,.08), 0 8px 22px rgba(36,71,55,.10);
}

body{
  background:
    radial-gradient(ellipse at top left, rgba(148,57,67,.08), transparent 52%),

}

.brand h1{

}

.brand p{
  color:#5e8269;
}

.seal-toggle{

}

}

.panel{

}

}

}

label{
  color:#5b8067;
}

input[type=text],
input[type=number],
select{
  background:#fbfdfb;

}

input[type=text]:focus,
input[type=number]:focus,
select:focus{

}

.btn{
  background:#315c46;
  color:#f4f8f3;
}

.btn:hover{
  background:#244737;
}

.btn.gold{
  background:#943943;
  color:#fff7f7;
}

.btn.gold:hover{
  background:#7f2d36;
}

.btn.ghost{
  border-color:#943943;
  color:#7f2d36;
}

.btn.ghost:hover{
  background:#943943;

}

.step-btn{
  background:#cfdfd1;

}

}

}

}

/* Classificazioni: dalla salvia al rosso, coerenti con la gravità. */
.class-X{--cc:#5f8a69}
.class-XX{--cc:#77946d}
.class-XXX{--cc:#a45a55}
.class-XXXX{--cc:#944047}
.class-XXXXX{--cc:#762832}

}

.fail,
.step-warning,

}

}

</style>

<body>
<div class="wrap">

<div class="med-seal" aria-hidden="true"><i class="fa-solid fa-stethoscope"></i></div>

<div class="brand">
<h1>Ospedale San Mungo per le Malattie e le Ferite Magiche</h1>
<p>Strumento di gestione Medimagica — Felix Felicis GdR</p>
</div>

<div id="ff-import-global"></div>

<div class="seal-toggle">
<button type="button" id="tab-paziente" class="active">Reparto Pazienti</button>
<button type="button" id="tab-medimago">Reparto Medimaghi</button>
</div>

<div id="view-paziente"></div>
<div id="view-medimago" class="hidden"></div>

<footer>Cartella clinica generata automaticamente — verifica sempre col Narratore in caso di dubbio.</footer>
</div>

<script>
/* ==========================================================================
DATI: Classificazione -> tempi/costi di guarigione
========================================================================== */
const CLASSI = ["X","XX","XXX","XXXX","XXXXX"];
const TEMPI = {

XX:    {post:5,  offgameMesi:3, degenza:"1 settimana ONGame",extra:1, costo:30,  sanmungo:15},

XXXX:  {post:9,  offgameMesi:5, degenza:"20 giorni ONGame",  extra:2, costo:90,  sanmungo:45},
XXXXX: {post:10, offgameMesi:6, degenza:"1 mese ONGame",     extra:3, costo:120, sanmungo:60},
};
function classIndex(c){return CLASSI.indexOf(c);}
function classeMax(lista){
if(!lista.length) return null;
return lista.reduce((m,c)=> classIndex(c)>classIndex(m)?c:m, lista[0]);
}
function isGrave(c){return classIndex(c)>=3;} // XXXX o XXXXX

/* ==========================================================================
DATI: Sintomi
n=nome, c=classificazione, r=rimedio ONGame, p=passaggi, x=complicazione
========================================================================== */
const SINTOMI = [
{id:"affaticamento",n:"Affaticamento",c:"X",r:"Massaggio Kold-ovstoeretz o Pozione della Fatica",p:"Somministrare una dose di Pozione della Fatica o applicare Massaggio Kold-ovstoeretz.",x:"Per i 2 post successivi il PG si addormenta ONGame se 1 su 1d5."},

{id:"ansia",n:"Ansia",c:"XX",r:"Massaggio Mahouto-kuoro o Hog-Watch; Pozione Calmante",p:"Bere Pozione Calmante; applicare il massaggio.",x:"Per 3 post il PG canta a squarciagola se 1 su 1d5."},
{id:"arrossamento",n:"Arrossamento",c:"X",r:"Lozione Lenitiva",p:"Somministrare una dose.",x:"Per 2 post colorito bluastro se 1 su 1d5."},
{id:"avvgrave",n:"Avvelenamento Grave",c:"XXXX",r:"Antidoto ai Veleni Non Comuni",p:"Somministrare una dose.",x:"Per 4 post continui rigurgiti se 1 su 1d5."},
{id:"avvlieve",n:"Avvelenamento Lieve",c:"XXX",r:"Antidoto ai Veleni Comuni",p:"Somministrare una dose.",x:"Per 3 post sputacchia ininterrottamente se 1 su 1d5."},
{id:"bassapressione",n:"Bassa Pressione",c:"XX",r:"Soluzione Mineralina; Tonico Tonificante",p:"Assumere entrambe.",x:"Per 2 post fa flessioni se 1 su 1d5."},
{id:"bloccocervellare",n:"Blocco Cervellare",c:"X",r:"Chewing-Gum Salivante",p:"Masticare, o diluire in acqua distillata se il PG non è in grado.",x:"Per 2 post lingua verde se 1 su 1d5."},
{id:"boccasecca",n:"Bocca Secca",c:"XXXX",r:"Pastiglia Antiglobulosa; Elisir di Baruffio; Ricostituente alla Mandragola",p:"Mangiare/diluire; assumere; somministrare.",x:"Per 4 post sangue dal naso se 1 su 1d5."},
{id:"bollesangue",n:"Bolle di Sangue",c:"XXXX",r:"Nihil Malus/Dolorfast; Pompetta Sterilizzante; Spruzzino Salino; Dottor Vermicolo; Siringa magica (n.2); Cera di Glumbumble; Puffskein Pulitore",p:"Pulire, idratare, drenare le bolle, versare cera e leccarla via.",x:"Per 4 post le bolle diventano pesanti e impediscono il movimento se 1 su 1d5."},
{id:"bronchiammalati",n:"Bronchi Ammalati",c:"XXX",r:"Essenza di Dittamo; Essenza di Purvincolo; Pastiglia Focolosa",p:"Bere le gocce diluite; mangiare la pastiglia.",x:"Per 3 post emette fumo dalla bocca se 1 su 1d5."},
{id:"bruciorecutaneo",n:"Bruciore Cutaneo",c:"XX",r:"Massaggio Salem-hani; Lozione Lenitiva; Caramella Gelante",p:"Assumere lozione; ingerire caramella e soffiare; applicare massaggio.",x:"Per 2 post pelle viola se 1 su 1d5."},
{id:"buchineri",n:"Buchi Neri",c:"X",r:"Obscuro; Siero Aggiustaocchi",p:"Somministrare tre gocce; riparare gli occhi con Obscuro.",x:"Per 2 post vede i volti scambiati se 1 su 1d5."},

<script>
/* Costruita per concatenazione per compatibilita con l'editor del forum */
const EVT_NAME = 'cli' + 'ck';
function onPress(el, fn){ el.addEventListener(EVT_NAME, fn); }
function esc(s){
const d = document.createElement('div');
d.textContent = s;
return d.innerHTML;
}
function copyText(txt, btn){
function fatto(){
const orig = btn.textContent;
btn.textContent = 'Copiato!';
setTimeout(function(){ btn.textContent = orig; }, 1400);
}
if(navigator.clipboard){
navigator.clipboard.writeText(txt).then(fatto, function(){ copiaFallback(txt); fatto(); });
} else {
copiaFallback(txt);
fatto();
}
}
function copiaFallback(txt){
const ta = document.createElement('textarea');
ta.value = txt;
ta.style.position = 'fixed';
ta.style.opacity = '0';
document.body.appendChild(ta);
ta.select();
try{ document.execCommand('copy'); } catch(e){}
document.body.removeChild(ta);
}
let widgetCounter = 0;

/* ==========================================================================
COMPONENTE DADO COPIABILE
opts: {faces, addends:[{label,value}], successLabel, onConfirm(risultato, esito, totale)}
Se totale > faces -> autoconclusivo positivo (nessun dado)
Se opts.forceFail -> autoconclusivo negativo, con opts.failText, nessun dado
========================================================================== */
function renderDiceCheck(container, opts){
widgetCounter += 1;
const uid = 'dw' + widgetCounter;

if(opts.forceFail){
container.innerHTML =
'<div class="result-box grave"><b>Esito automatico: fallimento.</b><br>' + esc(opts.failText) + '</div>';
if(opts.onConfirm){ opts.onConfirm(null, 'fail', null); }
return;
}

const totale = opts.addends.reduce(function(s,a){ return s + a.value; }, 0);
const formula = opts.addends.map(function(a){ return a.value + ' ' + a.label; }).join(' + ') + ' = ' + totale;

if(totale > opts.faces){
container.innerHTML =
'<div class="result-box ok"><b>Autoconclusivo: nessun dado necessario.</b><br>' +
esc(opts.successLabel + ' se 1-' + totale + ' (' + formula + ') — e sempre vero, si supera il massimo del dado.') + '</div>';
if(opts.onConfirm){ opts.onConfirm(null, 'auto', totale); }
return;
}

const label = opts.successLabel + ' se 1-' + totale + ' (' + formula + ')';
const tag = '[dice=1d' + opts.faces + ']' + label + '[/dice]';

container.innerHTML =
'<div class="dice-widget">' +
'<div class="muted">Il dado da lanciare e un 1d' + opts.faces + '. Copia il tag, lancialo sul topic dei dadi del forum, poi scrivi qui il risultato: appena il numero e valido lo elabora da solo.</div>' +
'<div class="dice-tag" id="' + uid + '_tag">' + esc(tag) + '</div>' +
'<div class="dice-actions">' +
'<button type="button" class="btn small gold" id="' + uid + '_copy">Copia il dado</button>' +
'</div>' +
'<div class="dice-input">' +
'<label style="margin:0">Risultato ottenuto:</label>' +
'<input type="number" id="' + uid + '_res" min="1" max="' + opts.faces + '" step="1">' +
'</div>' +
'<div class="dice-out" id="' + uid + '_out"></div>' +
'</div>';

onPress(document.getElementById(uid + '_copy'), function(){
copyText(tag, document.getElementById(uid + '_copy'));
});

let committed = false;
const inputEl = document.getElementById(uid + '_res');
const out = document.getElementById(uid + '_out');

function mostraAnteprima(){
const raw = inputEl.value.trim();
const r = Number(raw);
if(raw === '' || !Number.isFinite(r) || !Number.isInteger(r) || r < 1 || r > opts.faces){
out.innerHTML = raw.length ? '<span class="fail">Il risultato deve essere un numero intero fra 1 e ' + opts.faces + '.</span>' : '';
/* Se un risultato era già stato confermato, cancellarlo o renderlo non valido
   deve invalidare l'esito nello stato applicativo. L'azione resta però la
   stessa: committed rimane true, così un nuovo valore valido è una correzione
   e non genera un secondo addebito di Fatica. */
if(committed && opts.onInvalidate){ opts.onInvalidate(totale); }
if(opts.onLiveChange){ opts.onLiveChange(null, null, totale); }
return null;
}
const ok = r <= totale;
out.innerHTML = '<span class="' + (ok ? 'success' : 'fail') + '">Risultato ' + r + ' su 1-' + totale + ': ' +
(ok ? esc(opts.successLabel) : 'non riuscito') + '.</span>';
if(opts.onLiveChange){ opts.onLiveChange(r, ok ? 'ok' : 'fail', totale); }
return {r:r, ok:ok};
}

function conferma(){
const esito = mostraAnteprima();
if(!esito){ return; }
const isCorrection = committed;
committed = true;
if(opts.onConfirm){ opts.onConfirm(esito.r, esito.ok ? 'ok' : 'fail', totale, isCorrection); }
}

inputEl.addEventListener('input', function(){
mostraAnteprima();
});
inputEl.addEventListener('keydown', function(ev){
if(ev.key === 'Enter'){ conferma(); }
});
inputEl.addEventListener('blur', function(){ conferma(); });
}

/* ==========================================================================
STEPPER GENERICO
========================================================================== */
function buildStepper(root, containerId, steps, startAt){
let current = startAt || 0;
const html =
'<div class="stepper" id="' + containerId + '_nav"></div>' +
steps.map(function(s, i){
return '<div class="panel step-body' + (i===current?' active':'') + '" id="' + containerId + '_step' + i + '">' +
'<h2>' + esc(s.title) + '</h2>' +
'<p class="step-intro">' + esc(s.intro) + '</p>' +
'<div id="' + containerId + '_body' + i + '"></div>' +
'<div class="step-warning" id="' + containerId + '_warn' + i + '"></div>' +
'<div class="step-nav">' +
(i>0 ? '<button type="button" class="btn ghost" data-nav="' + containerId + '_prev' + i + '">Indietro</button>' : '<span></span>') +
(i<steps.length-1 ? '<button type="button" class="btn gold" data-nav="' + containerId + '_next' + i + '">Avanti</button>' : '<span></span>') +
'</div>' +
'</div>';
}).join('');
root.innerHTML = html;

function renderNav(){
const nav = document.getElementById(containerId + '_nav');
nav.innerHTML = steps.map(function(s, i){
let cls = 'step-btn';
if(i === current){ cls += ' active'; }
if(i < current){ cls += ' done'; }
/* Le fasi future non sono scorciatoie: per raggiungerle si usa Avanti,
   così ogni canLeave viene realmente validato. Le fasi già percorse restano cliccabili. */
const disabled = i > current ? ' disabled aria-disabled="true"' : '';
return '<button type="button" class="' + cls + '" data-goto="' + i + '"' + disabled + '>' + (i+1) + '. ' + esc(s.short) + '</button>';
}).join('');
Array.prototype.forEach.call(nav.querySelectorAll('button:not([disabled])'), function(b){
onPress(b, function(){
const target=parseInt(b.getAttribute('data-goto'), 10);
/* Cliccare la fase già attiva non deve ricostruirla: durante la correzione
   di un dado già registrato farebbe sparire il relativo campo pur lasciando
   l'azione in sospeso nello stato interno. */
if(target===current){return;}
if(target<current && steps[current].canLeaveBack){
const esito=steps[current].canLeaveBack();
if(esito!==true){const warnEl=document.getElementById(containerId+'_warn'+current);if(warnEl){warnEl.textContent=esito;}return;}
}
goTo(target);
});
});
}

function goTo(i){
for(let k=0;k<steps.length;k++){
document.getElementById(containerId + '_step' + k).classList.remove('active');
}
current = i;
document.getElementById(containerId + '_step' + i).classList.add('active');
renderNav();
if(steps[i].onShow){ steps[i].onShow(); }
try{
window.scrollTo({top:0, behavior:'smooth'});
} catch(e){
try{ window.scrollTo(0,0); } catch(e2){}
}
}

steps.forEach(function(s, i){
if(i>0){
const prevBtn = root.querySelector('[data-nav="' + containerId + '_prev' + i + '"]');
onPress(prevBtn, function(){
if(s.canLeaveBack){const esito=s.canLeaveBack();if(esito!==true){const warnEl=document.getElementById(containerId+'_warn'+i);if(warnEl){warnEl.textContent=esito;}return;}}
goTo(i-1);
});
}
if(i<steps.length-1){
const nextBtn = root.querySelector('[data-nav="' + containerId + '_next' + i + '"]');
onPress(nextBtn, function(){
const warnEl = document.getElementById(containerId + '_warn' + i);
if(s.canLeave){
const esito = s.canLeave();
if(esito !== true){
if(warnEl){ warnEl.textContent = esito; }
return;
}
}
if(warnEl){ warnEl.textContent = ''; }
goTo(i+1);
});
}
});

renderNav();
if(steps[current].onShow){ steps[current].onShow(); }
return {
goTo: goTo,
bodyId: function(i){ return containerId + '_body' + i; },
refreshCurrent: function(){ if(steps[current].onShow){ steps[current].onShow(); } }
};
}

const ffMedicalImport = {payload:null, importedIds:new Set(), unmatched:[]};
function ffNormName(v){
let x=String(v||'').toLowerCase();
try{x=x.normalize('NFD').replace(/[\u0300-\u036f]/g,'');}catch(e){}
return x.replace(/[^a-z0-9]+/g,' ').replace(/\s+/g,' ').trim();
}
function ffFindImportedSymptom(item){
if(!item || !item.n){return null;}
let target=ffNormName(item.n);
const aliases={
'perdita di funzionalita delle articolazioni':'perdita funzionalita delle articolazioni'
};
if(aliases[target]){target=aliases[target];}
let sameClass=null, any=null;
for(let i=0;i<SINTOMI.length;i++){
const s=SINTOMI[i];
if(ffNormName(s.n)===target){
if(item.c && s.c===item.c){sameClass=s;break;}
if(!any){any=s;}
}
}
return sameClass||any;
}
function ffReadImportPayload(){
if(!window.location.hash || window.location.hash.indexOf('ffmed=')<0){return null;}
try{
const q=window.location.hash.replace(/^#/,'');
const params=new URLSearchParams(q);
const raw=params.get('ffmed');
if(!raw){return null;}
const data=JSON.parse(raw);
if(!data || Number(data.v)!==1 || !Array.isArray(data.symptoms)){return null;}
return data;
}catch(e){return null;}
}

function ffApplyMedicalImport(){
const data=ffReadImportPayload();
if(!data){return;}
ffMedicalImport.payload=data;
ffMedicalImport.importedIds.clear();
ffMedicalImport.unmatched=[];
(data.symptoms||[]).forEach(function(item){
const s=ffFindImportedSymptom(item);
if(s){
pazienteState.scelti.add(s.id);
ffMedicalImport.importedIds.add(s.id);
if(typeof medimagoState!=='undefined'){medimagoState.classiDiagnosi.add(s.c);}
}else if(item && item.n){ffMedicalImport.unmatched.push(String(item.n));}
});
/* Non impostiamo causaNota e soprattutto NON aggiungiamo nulla a sintomiIndividuati:
   l'importazione non sostituisce la Diagnosi. */
pazienteState.metodo=null;
pazienteState.complicazioni={};
pazienteState.componentiConfermate=false;
pazienteState.componentiAuto=[];
const global=document.getElementById('ff-import-global');
if(global){global.innerHTML=ffImportSummaryHtml(true);}
if(pzStepper){renderStepSintomi(pzStepper.bodyId(0));}

}

function sintomiScelti(){
return Array.from(pazienteState.scelti).map(function(id){ return SINTOMI_BY_ID[id]; });
}
function costoTotale(scelti){
return scelti.reduce(function(a,s){ return a + TEMPI[s.c].costo; }, 0);
}
function costoSanMungo(scelti){
/* Il regolamento fornisce il costo San Mungo per ciascun singolo Sintomo:
   X=7, XX=15, XXX=30, XXXX=45, XXXXX=60. Va quindi sommato per Sintomo,
   non dimezzato il totale aggregato (due X costano 14 G, non 15). */
return scelti.reduce(function(a,s){ return a + TEMPI[s.c].sanmungo; }, 0);
}
function costoOffgameAnticipata(costoBase){
/* +10% esatto. Il regolamento non specifica un arrotondamento in caso di decimali. */
return Math.round((costoBase * 1.10) * 10) / 10;
}
function costoComponentiAuto(){
return pazienteState.componentiAuto.reduce(function(a,c){ return a + c.prezzo * c.qta; }, 0);
}
function sintomoSenzaRimedioDiretto(s){
return ['coma','paralisiperm','perditaorgani','perditaarticolazioni'].indexOf(s.id) >= 0;
}
function regolaComplicazioneSintomo(s){
const testo = (s && s.x ? String(s.x) : '').trim();
if(!testo || testo === '//'){ return {tipo:'nessuna', testo:testo}; }
if(/1d5/i.test(testo)){
const bersaglio = /\bse\s+5\b/i.test(testo) ? 5 : 1;
return {tipo:'d5', bersaglio:bersaglio, testo:testo};
}
return {tipo:'testo', testo:testo};
}
function testoComplicazionePassiva(s){
const r = regolaComplicazioneSintomo(s);
if(r.tipo === 'nessuna'){
return 'La scheda del Sintomo non descrive un effetto specifico di Complicazione.';
}
return r.testo;
}
function metodoEAttivo(m){ return m === 'sanmungo' || m === 'auto'; }
function metodoEPassivo(m){ return m === 'spontanea' || m === 'spontanea_bg' || m === 'riposo'; }

/* Aggiorna quantità e stima senza ricostruire il DOM: così si possono digitare

function aggiornaQuantita(normalizza){

const VOTI = [{v:"T",base:5},{v:"D",base:6},{v:"S",base:7},{v:"A",base:8},{v:"O",base:9},{v:"E",base:10}];
const ROMANI = ["I","II","III","IV","V"];

function opzioniLivelli(maxLiv){
let h = '<option value="0">Nessuna</option>';

return h;
}
function clampNum(v,min,max){ v=parseFloat(v); if(isNaN(v)) v=min; return Math.max(min,Math.min(max,v)); }
function clampInt(v,min,max){ const n=Number(v); if(!Number.isFinite(n)) return min; return Math.max(min,Math.min(max,Math.floor(n))); }

function profiloGuaritoreDaForm(){

let terap = parseInt(document.getElementById('g-terapista').value,10) || 0;

if(tipo === 'studente' || sap <= 0){ diagnost=Math.min(diagnost,1); terap=Math.min(terap,1); chirurg=Math.min(chirurg,1); }
const votoObj = VOTI.find(function(x){ return x.v===voto; }) || VOTI[0];
const diagBase = diagnost>0 ? 11+diagnost : (tipo==='studente' ? votoObj.base : 11);
const terBase = terap>0 ? 11+terap : (tipo==='studente' ? votoObj.base : 11);
let chiBase = null;
let chiAmbigua = false;
if(chirurg>0){ chiBase = 6+chirurg; }
else if(sap>0 && sap<=15){ chiBase = sap<=5 ? 4 : (sap<=10 ? 5 : 6); }
else if(sap>15){ chiAmbigua = true; }
const diagLabel = diagnost>0 ? 'Diagnosta '+ROMANI[diagnost-1] : (tipo==='studente' ? 'Studente, voto '+voto : 'Adulto senza Diagnosta');
const terLabel = terap>0 ? 'Terapista '+ROMANI[terap-1] : (tipo==='studente' ? 'Studente, voto '+voto : 'Adulto senza Terapista');
let chiLabel;

function rimuoviCureDaDiagnosiPerSintomi(ids){
const insieme = ids instanceof Set ? ids : new Set(ids || []);
let rimossi = 0;
for(let i=medimagoState.coda.length-1;i>=0;i--){
const item=medimagoState.coda[i];
if(item.origine!=='diagnosi' || !insieme.has(item.sid)){continue;}
const g=medimagoState.guaritori.find(function(x){return x.id===item.guaritoreId;});
if(g && item.entryRef){
g.fatica-=item.entryRef.fatica;
const ix=g.esiti.indexOf(item.entryRef);
if(ix>=0){g.esiti.splice(ix,1);}
}
medimagoState.coda.splice(i,1);
rimossi+=1;
}
if(rimossi){ricalcolaComplicazioniCoda();}
return rimossi;
}

function ultimoFallimentoDiagnosiNonRavveduto(g,c){
for(let i=g.esiti.length-1;i>=0;i--){
const e=g.esiti[i];
if(e.tipo==='Diagnosi' && e.classe===c){
if(e.esito==='fail' && e.ravvedimento!=='ok'){return e;}
return null;
}
}
return null;
}

/* Determina se, immediatamente PRIMA di questo tentativo, esiste ancora una
   Complicazione uguale attiva. Conta soltanto i tentativi precedenti nella
   coda: un tentativo successivo non può retroattivamente bloccarne uno prima. */
function complicazioneAttivaPrimaDi(item){
const idx=medimagoState.coda.indexOf(item);
if(idx<0){return false;}
let attiva=false;
for(let i=0;i<idx;i++){
const x=medimagoState.coda[i];
if(x.sid!==item.sid){continue;}
if(x.precedenteComplicazioneEsaurita){attiva=false;}
if(x.esito==='fail'){
const reg=regolaComplicazioneSintomo(SINTOMI_BY_ID[x.sid]);
if(reg.tipo!=='nessuna' && !attiva){attiva=true;}
}
}
return attiva;
}

/* Ricalcolo cronologico: serve quando un dado vecchio viene corretto, una
   card viene eliminata o si dichiara terminata la Complicazione precedente. */
function ricalcolaComplicazioniCoda(){
const attive={};
medimagoState.coda.forEach(function(item){
const ss=SINTOMI_BY_ID[item.sid];
const reg=regolaComplicazioneSintomo(ss);
if(item.precedenteComplicazioneEsaurita){attive[item.sid]=false;}
let stato=null;
if(item.esito==='fail'){
if(reg.tipo==='nessuna'){
stato='nessuna';
} else if(attive[item.sid]){
stato='bloccata';
} else {
stato='si';
attive[item.sid]=true;
}
}
aggiornaComplicazioneItem(item,stato,null,true);
});
renderStepRiepilogo();
}

function renderStepRiepilogo(){
const body = document.getElementById('md_body3');
if(!body){ return; }
if(!medimagoState.guaritori.length){
body.innerHTML = '<p class="muted">Nessun Guaritore ancora aggiunto.</p>';
return;
}
let html = '';
medimagoState.guaritori.forEach(function(g){
const conFatica = g.esiti.filter(function(e){ return typeof e.fatica === 'number'; });
let dettaglioFatica = '';
if(conFatica.length){
dettaglioFatica = conFatica.map(function(e){
return e.fatica + ' ' + e.tipo + ' ' + (e.sintomo || e.classe);
}).join(', ') + ' = ' + g.fatica;
} else {
dettaglioFatica = '0';
}
html += '<div class="panel" style="background:#fff">' +
'<h4>' + esc(g.nome) + '</h4>' +
'<div class="kv"><span>Fatica spesa</span><b>' + g.fatica + '</b></div>' +
'<p class="muted" style="font-size:13px">' + esc(dettaglioFatica) + '</p>';
if(g.esiti.length){
html += '<table class="tidy" style="margin-top:8px"><thead><tr><th>Fase</th><th>Bersaglio</th><th>Esito</th></tr></thead><tbody>';
g.esiti.forEach(function(e){
const bers = e.sintomo || e.classe;
let cls, txt;
if(e.esito === null){
cls = 'muted';
txt = 'In attesa del risultato';
} else if(e.tipo === 'Complicazione'){
cls = e.esito === 'fail' ? 'fail' : 'success';
txt = e.esito === 'fail' ? 'Complicazione comparsa' : 'Nessuna Complicazione';
} else {
cls = e.esito === 'fail' ? 'fail' : 'success';
txt = e.esito === 'fail' ? 'Non riuscito' : (e.esito === 'auto' ? 'Autoconclusivo' : 'Riuscito');
}
let extraComplicazione = '';
if(e.esito === 'fail' && (e.tipo === 'Terapia' || e.tipo === 'Chirurgia')){
const sint = e.sid ? SINTOMI_BY_ID[e.sid] : null;
if(e.complicazione === 'si' && sint){
extraComplicazione = '<br><span class="fail" style="font-weight:400;font-size:13px">Complicazione attiva: ' + esc(sint.x) + '<br>Finché è attiva, il paziente non può evocare magie, utilizzare Conoscenze né compiere altre azioni significative.</span>';
} else if(e.complicazione === 'no'){
extraComplicazione = '<br><span class="success" style="font-weight:400;font-size:13px">Nessuna Complicazione specifica applicata.</span>';
} else if(e.complicazione === 'bloccata'){
extraComplicazione = '<br><span class="success" style="font-weight:400;font-size:13px">Nessuna nuova Complicazione identica: la precedente è ancora attiva.</span><br><span class="fail" style="font-weight:400;font-size:13px">Finché la Complicazione precedente è attiva, il paziente non può evocare magie, utilizzare Conoscenze né compiere altre azioni significative.</span>';
} else if(e.complicazione === 'nessuna'){
extraComplicazione = '<br><span class="muted" style="font-weight:400;font-size:13px">La scheda non indica una Complicazione specifica.</span>';
} else {
extraComplicazione = '<br><span class="muted" style="font-weight:400;font-size:13px">Complicazione da applicare secondo la scheda del Sintomo.</span>';
}
}
html += '<tr><td>' + esc(e.tipo) + '</td><td>' + esc(bers) + '</td><td class="' + cls + '">' + txt + extraComplicazione + '</td></tr>';
});
html += '</tbody></table>';
} else {
html += '<p class="muted">Nessuna azione ancora registrata.</p>';
}
html += '</div>';
});
body.innerHTML = html;
}

<script id="sanmungo-autoheight" type="text/javascript">
(function(){
  "use strict";

  var lastHeight = 0;
  var timer = null;

  function misuraAltezzaReale(){
    var wrap = document.querySelector(".wrap");

    if(wrap){
      var rect = wrap.getBoundingClientRect();
      return Math.ceil(rect.bottom + window.pageYOffset + 8);
    }

    return Math.ceil(document.body.getBoundingClientRect().bottom + window.pageYOffset + 8);
  }

  function inviaAltezza(){
    var altezza = misuraAltezzaReale();

    if(!altezza || altezza < 100){
      return;
    }

    if(Math.abs(altezza - lastHeight) < 2){
      return;
    }

    lastHeight = altezza;

    window.parent.postMessage({
      tipo: "altezzaSanMungo",
      altezza: altezza
    }, "*");
  }

  function programmaInvio(){
    if(timer){
      clearTimeout(timer);
    }

    timer = setTimeout(function(){
      inviaAltezza();

      setTimeout(inviaAltezza, 80);
      setTimeout(inviaAltezza, 250);
    }, 20);
  }

  window.addEventListener("load", programmaInvio);
  window.addEventListener("pageshow", programmaInvio);
  window.addEventListener("resize", programmaInvio);

  /* I font web possono cambiare altezza e wrapping dopo il primo render. */
  if(document.fonts && document.fonts.ready){
    document.fonts.ready.then(function(){
      programmaInvio();
    }).catch(function(){});
  }

  document.addEventListener("click", programmaInvio, true);
  document.addEventListener("change", programmaInvio, true);
  document.addEventListener("input", programmaInvio, true);

  if(window.ResizeObserver){
    var ro = new ResizeObserver(function(){
      programmaInvio();
    });

    var wrap = document.querySelector(".wrap");
    if(wrap){
      ro.observe(wrap);
    }
  }

  if(window.MutationObserver){
    var mo = new MutationObserver(function(){
      programmaInvio();
    });

    mo.observe(document.body, {
      childList:true,
      subtree:true,
      attributes:true,
      characterData:false
    });
  }

  setTimeout(programmaInvio, 100);
  setTimeout(programmaInvio, 500);
  setTimeout(programmaInvio, 1200);
})();
</script>
